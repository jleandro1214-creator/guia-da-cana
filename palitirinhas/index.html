/* ================= TEXTO -> QUADROS ================= */
const semAcento=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function achar(lista,t){for(const[r,v]of lista)if(r.test(t))return v;return null}
function achaTodos(lista,t){const o=[];for(const[r,v]of lista)if(r.test(t)&&!o.includes(v))o.push(v);return o}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}

function montarQuadros(h){
  const linhas=h.texto.split(/\n+/).map(l=>l.trim()).filter(Boolean).slice(0,16);
  const nomes=h.personagens.filter(p=>p.nome.trim());
  let cena="branco",tempo="dia",ultimos=nomes.slice(0,1).map(p=>p.nome);
  const qs=[];
  for(const linha of linhas){
    let txt=linha;
    // marcadores manuais [praia] [noite]
    const marc=[];txt=txt.replace(/\[([^\]]+)\]/g,(m,g)=>{marc.push(semAcento(g));return""}).trim();
    const falas=[];let narr="";
    // "Nome: fala" (no começo ou depois de uma frase)
    const partes=[];
    const reNome=nomes.length?new RegExp("(^|[.!?…]\\s+)("+nomes.map(p=>escRe(p.nome.trim())).join("|")+")\\s*(disse|falou|gritou|pensou|perguntou|respondeu|riu muito|riu)?\\s*:\\s*","gi"):null;
    let resto=txt;
    if(reNome){
      let m,ult=0,atual=null;const pedacos=[];
      while((m=reNome.exec(txt))){pedacos.push({quem:atual,txt:txt.slice(ult,m.index+m[1].length),verbo:null});atual={nome:m[2],verbo:(m[3]||"")};ult=reNome.lastIndex}
      pedacos.push({quem:atual,txt:txt.slice(ult)});
      resto="";
      for(const p of pedacos){
        if(!p.quem){resto+=p.txt}
        else{

    case"celular":rRect(ctx,x-18,B-250,36,62,7);ctx.fillStyle="#1b1b1f";ctx.fill();rRect(ctx,x-13,B-244,26,46,3);ctx.fillStyle="#9be0ff";ctx.fill();ctx.save();ctx.strokeStyle="#1b1b1f";ctx.lineWidth=3;for(let i=1;i<=2;i++){ctx.beginPath();ctx.arc(x+20,B-250,i*10,R(-80),R(-10));ctx.stroke()}ctx.restore();break;
    case"trator":{rRect(ctx,x-60,B-80,90,40,6);ctx.fillStyle="#2ec27e";ctx.fill();ctx.strokeStyle="#1b1b1f";ctx.lineWidth=4;ctx.stroke();rRect(ctx,x-50,B-130,50,52,4);ctx.fillStyle="#bfe7ff";ctx.fill();ctx.stroke();linha(ctx,[[x+14,B-80],[x+14,B-112]],"#1b1b1f",6);circ(ctx,x-34,B-34,32,"#1b1b1f",false);circ(ctx,x-34,B-34,12,"#ffd23f",false);circ(ctx,x+40,B-20,20,"#1b1b1f",false);circ(ctx,x+40,B-20,8,"#ffd23f",false);break}

/* ----- balões ----- */
const FONTE='"Comic Sans MS","Comic Neue","Chalkboard SE","Segoe Print",system-ui,sans-serif';
function quebrar(ctx,txt,larg){const ps=txt.split(/\s+/);const ls=[];let l="";for(const p of ps){const t=l?l+" "+p:p;if(ctx.measureText(t).width>larg&&l){ls.push(l);l=p}else l=t}if(l)ls.push(l);return ls}
function caberTexto(ctx,txt,larg,maxLin,tam,min){for(let t=tam;t>=min;t-=2){ctx.font="700 "+t+"px "+FONTE;const ls=quebrar(ctx,txt,larg);if(ls.length<=maxLin)return{ls,t}}ctx.font="700 "+min+"px "+FONTE;let ls=quebrar(ctx,txt,larg);if(ls.length>maxLin){ls=ls.slice(0,maxLin);ls[maxLin-1]=ls[maxLin-1].replace(/\s*\S*$/,"")+"…"}return{ls,t:min}}

function narracao(ctx,txt){
  if(!txt)return 0;
  const{ls,t}=caberTexto(ctx,txt,540,3,26,17);const lh=t*1.22;const h=ls.length*lh+18;
  ctx.save();rRect(ctx,10,10,580,h,6);ctx.fillStyle="#ffd23f";ctx.fill();ctx.strokeStyle="#1b1b1f";ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle="#1b1b1f";ctx.textBaseline="top";ctx.textAlign="left";ctx.font="700 "+t+"px "+FONTE;ls.forEach((l,i)=>ctx.fillText(l,24,18+i*lh));ctx.restore();
  return h+10;
}
function balao(ctx,txt,cx,topo,larg,alvo,pensa,corBorda){
  const{ls,t}=caberTexto(ctx,txt,larg-34,4,27,16);const lh=t*1.2;
  ctx.font="700 "+t+"px "+FONTE;const w=Math.min(larg,Math.max(...ls.map(l=>ctx.measureText(l).width))+40);const h=ls.length*lh+26;
  let x=Math.max(8,Math.min(600-w-8,cx-w/2));const y=topo;
  ctx.save();
  // rabinho
  const bx=Math.max(x+24,Math.min(x+w-24,alvo[0]));const by=y+h;
  const ty=Math.max(by+14,Math.min(alvo[1]-8,by+70));
  if(pensa){for(let i=1;i<=3;i++){const k=i/3.4;circ(ctx,bx+(alvo[0]-bx)*k,by+(alvo[1]-by)*k,9-i*2,"#fff","#1b1b1f",3)}}
  else{ctx.beginPath();ctx.moveTo(bx-14,by-3);ctx.lineTo(bx+(alvo[0]-bx)*.85,ty);ctx.lineTo(bx+12,by-3);ctx.closePath();ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#1b1b1f";ctx.lineWidth=4;ctx.stroke()}
  if(pensa){ctx.beginPath();const n=Math.max(6,Math.round((w+h)/34));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const px=x+w/2+Math.cos(a)*w/2,py=y+h/2+Math.sin(a)*h/2;ctx.moveTo(px+14,py);ctx.arc(px,py,14,0,7)}ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#1b1b1f";ctx.lineWidth=3.5;ctx.stroke();ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);ctx.fill()}
  else{ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2+10,h/2+6,0,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle=corBorda||"#1b1b1f";ctx.lineWidth=4;ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-13,by-5);ctx.lineTo(bx+11,by-5);ctx.lineWidth=7;ctx.strokeStyle="#fff";ctx.stroke()}
  ctx.fillStyle="#1b1b1f";ctx.textBaseline="top";ctx.textAlign="center";ctx.font="700 "+t+"px "+FONTE;ls.forEach((l,i)=>ctx.fillText(l,x+w/2,y+13+i*lh));
  ctx.restore();return{x,y,w,h};
}

function desenharQuadro(ctx,q,h,opc){
  opc=opc||{};
  ctx.save();ctx.textAlign="left";ctx.textBaseline="alphabetic";ctx.fillStyle="#fff";ctx.fillRect(0,0,600,600);
  cenario(ctx,q.cena,q.tempo);
  const pers=q.chars.map(c=>({c,p:h.personagens.find(p=>p.nome===c.nome)||{nome:c.nome,cor:"#1b1b1f",acess:"nada"}}));
  const n=pers.length;
  const abraco=n===2&&pers.every(x=>x.c.pose==="abracar");
  let xs=n===1?[300]:n===2?(abraco?[250,350]:[190,410]):n===3?[120,300,480]:[80,227,374,521];
  // objetos: no chão perto das bordas; voadores em cima
  const voa=["coracao","passaro","celular"];
  const livres=n<=1?[110,490,200]:n===2?[60,540,300]:n===3?[45,555,220]:[40,560,305];
  const hits=opc.hits||[];
  const desl=id=>{if(opc.tmp&&opc.tmp.id===id)return[opc.tmp.dx,opc.tmp.dy];const p=(q.pos||{})[id];return p||[0,0]};
  let k=0;
  for(const o of (q.objs||[])){const x=voa.includes(o)?(o==="coracao"?xs.reduce((a,b)=>a+b,0)/Math.max(1,n):(o==="celular"?110:150)):livres[k++%livres.length];
    const id="o:"+o,[dx,dy]=desl(id);ctx.save();ctx.translate(dx,dy);objeto(ctx,o,x);ctx.restore();
    const bx=OBJ_CAIXA[o]||[-40,-80,80,80];hits.push({id,x:x+bx[0]+dx,y:CHAO+bx[1]+dy,w:bx[2],h:bx[3],tipo:"o"})}
  const cabecas={};
  pers.forEach((x,i)=>{
    let f=n===1?1:(xs[i]<300?1:-1);if(n===3&&i===1)f=1;
    const s=x.p.crianca?1.08:1.32;
    const id="c:"+x.c.nome,[dx,dy]=desl(id);
    ctx.save();ctx.translate(dx,dy);
    const r=bonequinho(ctx,xs[i],f,x.p,x.c.pose,x.c.expr,s);
    ctx.restore();
    r.cabC=[r.cabC[0]+dx,r.cabC[1]+dy];
    cabecas[x.c.nome]=r;
    if(r.deit){const x0=Math.min(r.cabC[0],r.x+dx)-40,x1=Math.max(r.cabC[0],r.x+dx)+40;hits.push({id,x:x0,y:CHAO-80+dy,w:x1-x0,h:96,tipo:"c"})}
    else{const top=r.cabC[1]-r.raio-12;hits.push({id,x:xs[i]+dx-58*s,y:top,w:116*s,h:CHAO+8+dy-top,tipo:"c"})}
    if(x.c.expr==="sono"||x.c.pose==="deitar"&&x.c.expr==="sono"){ctx.save();ctx.fillStyle="#3a86ff";ctx.font="800 30px "+FONTE;const bx=r.cabC[0]+24;const by=r.cabC[1]-34;ctx.fillText("z",bx,by);ctx.font="800 40px "+FONTE;ctx.fillText("Z",bx+22,by-26);ctx.restore()}
    if(x.c.pose==="cair"){ctx.save();ctx.fillStyle="#ffd23f";ctx.strokeStyle="#1b1b1f";ctx.lineWidth=2;for(const[a,b]of[[-30,-40],[30,-50],[0,-62]]){ctx.beginPath();estrela(ctx,r.cabC[0]+a,r.cabC[1]+b,9);ctx.fill();ctx.stroke()}ctx.restore()}
  });
  if(abraco){const c0=cabecas[pers[0].c.nome].cabC,c1=cabecas[pers[1].c.nome].cabC;const c=[(c0[0]+c1[0])/2,Math.min(c0[1],c1[1])-50];coracaoP(ctx,c[0],c[1],16,"#ff5d5d")}
  // textos
  let topo=narracao(ctx,q.narr)+8;if(!q.narr)topo=16;
  const falas=q.falas||[];
  if(falas.length){
    const nf=Math.min(falas.length,3);
    const larg=nf===1?420:nf===2?290:190;
    falas.slice(0,3).forEach((f,i)=>{
      const cab=cabecas[f.quem]||Object.values(cabecas)[0];
      const alvo=cab?[cab.cabC[0],cab.cabC[1]-cab.raio-6]:[300,300];
      let cx=nf===1?alvo[0]:nf===2?(i===0?160:440):[110,300,490][i];
      if(nf===2&&cab){const outras=falas.slice(0,2).map(ff=>(cabecas[ff.quem]||{cabC:[300]}).cabC[0]);if(outras[0]>outras[1])cx=i===0?440:160}
      const y=nf===3?topo+(i%2)*24:topo+(nf===2?(i?30:0):0);
      const maxY=alvo[1]-80;
      const yy=Math.min(y,Math.max(topo,maxY-60));
      const id="f:"+i,[dx,dy]=desl(id);
      const bb=balao(ctx,f.txt,cx+dx,Math.max(4,Math.min(520,yy+dy)),larg,alvo,f.pensa,null);
      hits.push({id,x:bb.x-10,y:bb.y-6,w:bb.w+20,h:bb.h+12,tipo:"f"});
    });
  }
  if(opc.sel){const hb=hits.filter(x=>x.id===opc.sel).pop();if(hb){ctx.save();ctx.setLineDash([12,8]);ctx.lineWidth=4;ctx.strokeStyle="#ff5d5d";rRect(ctx,hb.x-6,hb.y-6,hb.w+12,hb.h+12,12);ctx.stroke();ctx.restore()}}
  if(opc.marca){ctx.save();ctx.globalAlpha=.55;ctx.font="700 16px "+FONTE;ctx.fillStyle="#1b1b1f";ctx.textAlign="right";ctx.fillText("Palitirinhas",590,592);ctx.restore()}
  ctx.restore();
}

const OBJ_CAIXA={arvore:[-82,-232,164,232],carro:[-80,-100,160,100],bola:[-26,-46,52,46],cachorro:[-56,-88,122,88],gato:[-60,-92,104,92],flor:[-28,-92,56,92],bolo:[-56,-120,112,120],presente:[-40,-88,80,88],coracao:[-46,-282,92,78],passaro:[-38,-324,132,62],casinha:[-80,-166,160,166],foguete:[-46,-178,92,172],celular:[-24,-266,58,80],trator:[-72,-138,144,138]};
function canvasQuadro(q,h,tam){
  const c=document.createElement("canvas");const dpr=Math.min(2.5,window.devicePixelRatio||1);const px=Math.round((tam||600)*dpr);
  c.width=px;c.height=px;const ctx=c.getContext("2d");ctx.scale(px/600,px/600);desenharQuadro(ctx,q,h);return c;
}
function miniPersonagem(p,cv){
  const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=84*dpr;cv.height=104*dpr;const ctx=cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.scale(cv.width/300,cv.height/370);ctx.translate(-150,-170);
  bonequinho(ctx,300,1,p,"acenar","feliz",p.crianca?.85:1);
}

      b.onclick=()=>{const p=ta.selectionStart??ta.value.length;let txt=ins;if(ins!=="\n"&&p>0&&ta.value[p-1]!=="\n")txt="\n"+ins;ta.value=ta.value.slice(0,p)+txt+ta.value.slice(p);ta.focus();const np=p+txt.length;ta.setSelectionRange(np,np);conta()};at.appendChild(b)});
    $("#bVolta").onclick=()=>{etapa=1;telaEditor()};
    $("#bCriar").onclick=()=>{if(!ta.value.trim()){aviso("Escreva pelo menos uma linha 😉");ta.focus();return}
      if(!h.titulo.trim())h.titulo="Minha história";salvarAtual();mostrar("tira")};
  }
}
function salvarAtual(){const h=atual;delete h.nova;h.atualizado=Date.now();const i=historias.findIndex(x=>x.id===h.id);if(i>=0)historias[i]=h;else historias.push(h);guardar()}

function telaTira(){
  const h=atual;const qs=montarQuadros(h);
  app.innerHTML=`<section class="tela"><div class="titulo-tira">${esc(h.titulo||"Minha história")}</div><div class="tira" id="tira"></div>
   <p class="dica" style="text-align:center;margin-top:18px">✋ <b>Toque e segure</b> num boneco, objeto ou balão e arraste para mudar de lugar.<br>Algo não ficou bom? Toque em <b>Mudar</b> no quadrinho.</p></section>`;
  const t=$("#tira");
  qs.forEach((q,i)=>{const d=document.createElement("div");d.className="quadro";const cv=canvasQuadro(q,h,600);
    d.appendChild(cv);d.insertAdjacentHTML("beforeend",`<div class="num">${i+1}</div><button class="editar">🎨 Mudar</button>`);
    d.querySelector(".editar").onclick=()=>editarQuadro(i);ativarArrasto(cv,i,q);t.appendChild(d)});
  if(!qs.length)t.innerHTML=`<div class="vazio">A história está vazia.</div>`;
  document.querySelectorAll(".barra-acoes").forEach(x=>x.remove());
  const barra=document.createElement("div");barra.className="barra-acoes";
  barra.innerHTML=`<button class="btn" id="bInicio" aria-label="Início">🏠</button><button class="btn" id="bEdit">✏️ Texto</button><button class="btn verde" id="bComp">📤 Enviar</button><button class="btn amarelo" id="bSalvar">💾 Imagem</button>`;
  document.body.appendChild(barra);
  $("#bInicio").style.flex="0 0 56px";
  $("#bInicio").onclick=()=>{if(h.nova&&!confirm("Esse exemplo ainda não foi salvo. Sair mesmo assim?"))return;mostrar("inicio")};
  $("#bEdit").onclick=()=>{etapa=2;document.querySelector(".barra-acoes")?.remove();$("#abas").hidden=false;tela="editor";telaEditor();marcarAba("novo");window.scrollTo(0,0)};
  $("#bSalvar").onclick=async()=>{if(h.nova)salvarAtual();const b=await imagemTira(h);baixar(b,nomeArq(h));aviso("Imagem salva na pasta Downloads 🎉")};
  $("#bComp").onclick=async()=>{if(h.nova)salvarAtual();const b=await imagemTira(h);const arq=new File([b],nomeArq(h),{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[arq]})){try{await navigator.share({files:[arq],title:h.titulo,text:"Olha a tirinha que eu fiz no Palitirinhas! ✏️"})}catch(e){}}
    else{baixar(b,nomeArq(h));aviso("Seu celular não deixou enviar direto. Salvei a imagem para você mandar 😉")}};
}
/* ----- segurar e arrastar ----- */
function ativarArrasto(cv,i,q){
  const h=atual;let hits=[],timer=null,ini=null,alvo=null,base=[0,0],tmp=null,quadroPend=false;
  const desenha=(sel)=>{hits=[];const ctx=cv.getContext("2d");ctx.setTransform(1,0,0,1,0,0);ctx.scale(cv.width/600,cv.height/600);desenharQuadro(ctx,q,h,{hits,tmp,sel})};
  desenha();
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
  const acha=([x,y])=>{const dentro=hits.filter(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);const ord={f:3,c:2,o:1};dentro.sort((a,b)=>ord[a.tipo]-ord[b.tipo]);return dentro.pop()};
  const pegar=p=>{const b=acha(p);if(!b)return false;alvo=b.id;base=(q.pos&&q.pos[alvo])?q.pos[alvo].slice():[0,0];tmp={id:alvo,dx:base[0],dy:base[1]};ini=p;
    try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}desenha(alvo);return true};
  const mover=p=>{if(!alvo)return;tmp.dx=Math.max(-560,Math.min(560,base[0]+p[0]-ini[0]));tmp.dy=Math.max(-420,Math.min(300,base[1]+p[1]-ini[1]));
    if(!quadroPend){quadroPend=true;requestAnimationFrame(()=>{quadroPend=false;desenha(alvo)})}};
  const soltar=()=>{clearTimeout(timer);timer=null;if(!alvo)return;
    const id=alvo,dx=Math.round(tmp.dx),dy=Math.round(tmp.dy);alvo=null;tmp=null;
    h.ajustes=h.ajustes||{};let a=h.ajustes[i];if(!a||a.src!==q.src)a=h.ajustes[i]={src:q.src,chars:{}};
    a.pos=a.pos||{};if(Math.abs(dx)<3&&Math.abs(dy)<3)delete a.pos[id];else a.pos[id]=[dx,dy];
    q.pos=Object.assign({},a.pos);if(!h.nova)salvarAtual();desenha()};
  // toque (celular)
  let t0=null;
  cv.addEventListener("touchstart",e=>{if(e.touches.length>1)return;const tq=e.touches[0];t0=[tq.clientX,tq.clientY];const p=pt(tq);
    timer=setTimeout(()=>{timer=null;pegar(p)},420)},{passive:true});
  cv.addEventListener("touchmove",e=>{const tq=e.touches[0];
    if(alvo){e.preventDefault();mover(pt(tq));return}
    if(timer&&t0&&Math.hypot(tq.clientX-t0[0],tq.clientY-t0[1])>10){clearTimeout(timer);timer=null}},{passive:false});
  cv.addEventListener("touchend",soltar);cv.addEventListener("touchcancel",soltar);
  cv.addEventListener("contextmenu",e=>e.preventDefault());
  // mouse (computador)
  cv.addEventListener("mousedown",e=>{const p=pt(e);timer=setTimeout(()=>{timer=null;pegar(p)},300)});
  cv.addEventListener("mousemove",e=>{if(alvo)mover(pt(e))});
  addEventListener("mouseup",()=>{if(alvo||timer)soltar()});
}
function nomeArq(h){return (semAcento(h.titulo||"tirinha").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"tirinha")+".png"}
function baixar(blob,nome){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function imagemTira(h){
  const qs=montarQuadros(h);const cols=qs.length===1?1:2;const linhas=Math.ceil(qs.length/cols);
  const Q=600,G=28,TOP=110,BASE=60;const W=cols*Q+(cols+1)*G;const H=TOP+linhas*Q+(linhas-1)*G+BASE+G;
  const c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
  ctx.fillStyle="#fffdf7";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1b1b1f";ctx.textAlign="center";ctx.textBaseline="middle";
  const{t}=caberTexto(ctx,h.titulo||"Minha história",W-60,1,58,30);ctx.font="800 "+t+"px "+FONTE;ctx.fillText(h.titulo||"Minha história",W/2,TOP/2+4);
  qs.forEach((q,i)=>{const x=G+(i%cols)*(Q+G),y=TOP+Math.floor(i/cols)*(Q+G);
    ctx.save();ctx.fillStyle="#1b1b1f";ctx.fillRect(x+8,y+8,Q,Q);ctx.translate(x,y);ctx.beginPath();ctx.rect(0,0,Q,Q);ctx.clip();desenharQuadro(ctx,q,h);ctx.restore();
    ctx.save();ctx.strokeStyle="#1b1b1f";ctx.lineWidth=7;ctx.strokeRect(x,y,Q,Q);ctx.restore()});
  if(qs.length%2===1&&cols===2){const x=G+Q+G,y=TOP+(linhas-1)*(Q+G);ctx.save();ctx.font="800 64px "+FONTE;ctx.fillStyle="#1b1b1f";ctx.textAlign="center";ctx.fillText("FIM",x+Q/2,y+Q/2-20);ctx.font="700 26px "+FONTE;ctx.fillStyle="#6b6b75";ctx.fillText("✏️ feito no Palitirinhas",x+Q/2,y+Q/2+40);ctx.restore()}
  ctx.save();ctx.font="700 24px "+FONTE;ctx.fillStyle="#6b6b75";ctx.textAlign="center";ctx.fillText("✏️ Feito no Palitirinhas",W/2,H-BASE/2-6);ctx.restore();
  return new Promise(r=>c.toBlob(r,"image/png"));
}

/* ----- folha de edição do quadro ----- */
function editarQuadro(i){
  const h=atual;
  const render=()=>{
    const qs=montarQuadros(h);const q=qs[i];if(!q)return fechar();
    h.ajustes=h.ajustes||{};let a=h.ajustes[i];if(!a||a.src!==q.src)a=h.ajustes[i]={src:q.src,chars:{}};
    folha.innerHTML=`<div class="topo"><h2 style="margin:0">Quadrinho ${i+1}</h2><button class="btn peq amarelo" id="fOk">✔ Pronto</button></div>
      <div class="previa" id="fPrev"></div>
      <h3>🏞️ Lugar</h3><div class="grade-ic">${CENAS.map(([k,n,e])=>`<button data-cena="${k}" aria-pressed="${q.cena===k}"><span class="e">${e}</span>${n}</button>`).join("")}</div>
      <h3>⛅ Tempo</h3><div class="grade-ic">${TEMPOS.map(([k,n,e])=>`<button data-tempo="${k}" aria-pressed="${q.tempo===k}"><span class="e">${e}</span>${n}</button>`).join("")}</div>
      ${q.chars.map(c=>`<h3>🧍 ${esc(c.nome)}: o que faz?</h3><div class="grade-ic">${POSES.map(([k,n,e])=>`<button data-p="${esc(c.nome)}" data-pose="${k}" aria-pressed="${c.pose===k}"><span class="e">${e}</span>${n}</button>`).join("")}</div>
        <h3>😀 ${esc(c.nome)}: como está?</h3><div class="grade-ic">${EXPR.map(([k,n,e])=>`<button data-p="${esc(c.nome)}" data-expr="${k}" aria-pressed="${c.expr===k}"><span class="e">${e}</span>${n}</button>`).join("")}</div>`).join("")}
      <h3>🎈 Coisas no quadro (até 3)</h3><div class="grade-ic">${OBJETOS.map(([k,n,e])=>`<button data-obj="${k}" aria-pressed="${q.objs.includes(k)}"><span class="e">${e}</span>${n}</button>`).join("")}</div>
      <div style="margin-top:16px" class="linha-btns"><button class="btn" id="fReset">↺ Voltar ao automático</button></div>`;
    const prev=canvasQuadro(q,h,400);$("#fPrev").appendChild(prev);
    folha.querySelectorAll("[data-cena]").forEach(b=>b.onclick=()=>{a.cena=b.dataset.cena;salvar()});
    folha.querySelectorAll("[data-tempo]").forEach(b=>b.onclick=()=>{a.tempo=b.dataset.tempo;salvar()});
    folha.querySelectorAll("[data-pose]").forEach(b=>b.onclick=()=>{const n=b.dataset.p;(a.chars[n]=a.chars[n]||{}).pose=b.dataset.pose;salvar()});
    folha.querySelectorAll("[data-expr]").forEach(b=>b.onclick=()=>{const n=b.dataset.p;(a.chars[n]=a.chars[n]||{}).expr=b.dataset.expr;salvar()});
    folha.querySelectorAll("[data-obj]").forEach(b=>b.onclick=()=>{let o=(a.objs||q.objs).slice();const k=b.dataset.obj;if(o.includes(k))o=o.filter(x=>x!==k);else{if(o.length>=3)o.shift();o.push(k)}a.objs=o;salvar()});
    $("#fReset").onclick=()=>{delete h.ajustes[i];salvar()};
    $("#fOk").onclick=fechar;
  };
  const salvar=()=>{const y=folha.scrollTop;if(!h.nova)salvarAtual();render();folha.scrollTop=y};
  const fundo=document.createElement("div");fundo.className="fundo-folha";const folha=document.createElement("div");folha.className="folha";
  const fechar=()=>{fundo.remove();folha.remove();const y=window.scrollY;telaTira();window.scrollTo(0,y)};
  fundo.onclick=fechar;document.body.append(fundo,folha);render();
}
