name: Acervo de vídeos do Ondas
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["podcasts/acervo/fontes.json", "podcasts/acervo/atualizar.mjs"]
permissions:
  contents: write
concurrency: acervo-videos
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node podcasts/acervo/atualizar.mjs
      - run: |
          git config user.name "Acervo Ondas"
          git config user.email "acervo-ondas@users.noreply.github.com"
          git add podcasts/acervo/videos.json
          git diff --cached --quiet || (git commit -m "Acervo de vídeos atualizado" && git pull --rebase -q origin main && git push)
