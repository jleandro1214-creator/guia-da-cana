<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Corpo em Foco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --verde:#2f5d34; --verde-2:#4f8a3c; --verde-claro:#e4efd9;
  --amarelo:#f2c230; --amarelo-claro:#fbefc2;
  --marrom:#6b4423; --marrom-claro:#efe4d6;
  --fundo:#fbf7ec; --texto:#2b2418; --suave:#6e6454; --linha:#e3d9c4; --branco:#fffdf7;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
body{min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit}
img{max-width:100%}

/* Cabeçalho */
.topo{background:var(--verde);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.topo-linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{width:38px;height:38px;border-radius:10px;flex:none}
.marca h1{font-size:21px;line-height:1.1;margin:0;letter-spacing:.2px}
.marca p{margin:0;font-size:13px;color:#d9e8cf}
.btn-instalar{background:var(--amarelo);color:#3a2a0b;border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;flex:none}
.busca{margin-top:12px;position:relative}
.busca input{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;color:var(--texto)}
.busca input:focus{outline:3px solid var(--amarelo)}

main{padding:16px 16px 8px;max-width:760px;margin:0 auto}
.intro{background:var(--amarelo-claro);border:1px solid #ecd98a;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:16px;color:#4a3a12}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px;cursor:pointer}
.cartao:active{transform:scale(.98)}
.selo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:var(--verde-2)}
.cartao.m .selo{background:var(--marrom)}
.cartao.o .selo{background:#b8891a;color:#fff}
.cartao h3{margin:2px 0 0;font-size:18px;line-height:1.2}
.cartao small{color:var(--suave);font-size:14px;line-height:1.3}
.vazio{text-align:center;color:var(--suave);padding:30px 10px}

/* Detalhe */
.detalhe{position:fixed;inset:0;background:var(--fundo);z-index:40;overflow-y:auto;padding-bottom:40px}
.det-topo{position:sticky;top:0;background:var(--verde);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:2}
.voltar{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:16px}
.det-topo span{font-size:14px;color:#d9e8cf}
.det-corpo{max-width:760px;margin:0 auto;padding:16px}
.det-corpo h2{font-size:28px;line-height:1.15;margin:6px 0 4px}
.etiqueta{display:inline-block;background:var(--verde-claro);color:var(--verde);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.figura{margin:14px 0;background:#fff;border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.figura .moldura{min-height:200px;display:grid;place-items:center;background:#fff;padding:8px}
.figura img{display:block;max-height:420px;width:auto;margin:0 auto;object-fit:contain}
.figura .falha{padding:22px 16px;text-align:center;color:var(--suave);font-size:15px}
.figura .falha button{margin-top:10px;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.figura figcaption{border-top:1px solid var(--linha);padding:10px 12px;font-size:13.5px;color:var(--suave);line-height:1.4}
.figura figcaption a{color:var(--marrom);font-weight:700}
.bloco{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;margin:12px 0}
.bloco h4{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--marrom)}
.bloco p{margin:0}
.bloco ul{margin:4px 0 0;padding-left:20px}
.bloco li{margin:3px 0}
.curio{background:var(--amarelo-claro);border-color:#ecd98a}
.curio h4{color:#7a5a05}

/* Navegação inferior */
nav.abas{position:fixed;left:0;right:0;bottom:0;background:var(--branco);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.abas button{background:none;border:0;border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;font-weight:700;color:var(--suave)}
nav.abas button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.abas button[aria-selected="true"]{background:var(--verde-claro);color:var(--verde)}

/* Quiz */
.quiz-caixa{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:18px 16px}
.quiz-caixa h2{margin:0 0 6px;font-size:26px;line-height:1.15}
.placar{display:flex;gap:10px;margin:12px 0}
.placar div{flex:1;background:var(--verde-claro);border-radius:12px;padding:8px 10px;text-align:center;font-size:13.5px;color:var(--verde);font-weight:700}
.placar b{display:block;font-size:22px;color:var(--verde)}
.btn{display:block;width:100%;background:var(--verde);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:18px;margin-top:12px}
.btn.amarelo{background:var(--amarelo);color:#3a2a0b}
.btn.sec{background:var(--marrom-claro);color:var(--marrom)}
.progresso{height:8px;border-radius:99px;background:var(--marrom-claro);overflow:hidden;margin:6px 0 14px}
.progresso i{display:block;height:100%;background:var(--amarelo);width:0;transition:width .25s}
.pergunta{font-size:21px;line-height:1.3;font-weight:700;margin:4px 0 14px}
.opcao{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--linha);border-radius:14px;padding:13px 14px;margin:9px 0;font-size:17.5px;cursor:pointer}
.opcao.certa{border-color:var(--verde-2);background:var(--verde-claro)}
.opcao.errada{border-color:#a4452c;background:#f6dfd7}
.opcao[disabled]{cursor:default}
.retorno{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:16.5px}
.retorno.ok{background:var(--verde-claro);color:#1f4325}
.retorno.no{background:#f6dfd7;color:#6b2a18}
.nota-final{font-size:56px;font-weight:800;color:var(--verde);line-height:1;margin:8px 0}
.rodape{max-width:760px;margin:18px auto 0;padding:0 16px;font-size:13px;color:var(--suave)}
.rodape a{color:var(--marrom)}
.instala-dica{background:var(--branco);border:1px dashed var(--marrom);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-linha">
    <div class="marca">
      <img src="icon-192.png" alt="">
      <div><h1>Corpo em Foco</h1><p>Conheça o seu corpo</p></div>
    </div>
    <button class="btn-instalar" id="btnInstalar" hidden>Instalar app</button>
  </div>
  <div class="busca" id="buscaBox">
    <input id="busca" type="search" placeholder="Buscar pelo nome..." autocomplete="off" aria-label="Buscar pelo nome">
  </div>
</header>

<main id="tela"></main>
<div class="rodape" id="rodape"></div>

<section class="detalhe" id="detalhe" hidden>
  <div class="det-topo"><button class="voltar" id="voltar">&larr; Voltar</button><span id="detCat"></span></div>
  <div class="det-corpo" id="detCorpo"></div>
</section>

<nav class="abas" id="abas" role="tablist" aria-label="Seções">
  <button role="tab" data-aba="orgaos" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Órgãos
  </button>
  <button role="tab" data-aba="musculos" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 14c0-4 2-7 6-7s6 3 6 7-2 5-4 5H10c-2 0-4-1-4-5z"/><path d="M9 12c1 1 2 1 3 0s2-1 3 0"/></svg>Músculos
  </button>
  <button role="tab" data-aba="ossos" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M7 7a2 2 0 1 1 3-2l7 7a2 2 0 1 1 2 3 2 2 0 1 1-3 2l-7-7a2 2 0 1 1-2-3z" transform="rotate(0)"/></svg>Ossos
  </button>
  <button role="tab" data-aba="quiz" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8"/><path d="M12 17h.01"/></svg>Quiz
  </button>
</nav>

var $ = function(s){return document.querySelector(s)};
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function imgUrl(n){return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(n)+'?width=700'}

function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ler(k){try{return localStorage.getItem(k)}catch(e){return null}}

  ossos:'O corpo adulto tem 206 ossos. Toque para conhecer os principais.'
};

function trocarAba(a){
  aba = a;
  document.querySelectorAll('#abas button').forEach(function(b){b.setAttribute('aria-selected', b.dataset.aba===a ? 'true':'false')});
  $('#buscaBox').hidden = (a==='quiz');
  $('#busca').value='';
  window.scrollTo(0,0);
  if(a==='quiz') telaQuizInicio(); else telaLista();
}

function telaLista(){
  var termo = norm($('#busca').value.trim());
  var lista = DADOS[aba].filter(function(x){return !termo || norm(x.nome).indexOf(termo)>-1 || norm(x.sis).indexOf(termo)>-1});
  var h = '<p class="intro">'+esc(TITULOS[aba])+'</p>';
  if(!lista.length){ h += '<div class="vazio">Nada encontrado com esse nome.</div>'; }
  else{
    h += '<div class="grade">';
    lista.forEach(function(x){
      h += '<button class="cartao '+CLASSE[aba]+'" data-id="'+x.id+'"><span class="selo">'+esc(x.nome.charAt(0))+'</span><h3>'+esc(x.nome)+'</h3><small>'+esc(x.sis)+'</small></button>';
    });
    h += '</div>';
  }
  $('#tela').innerHTML = h;
  rodape(true);
}

function rodape(mostra){
  $('#rodape').innerHTML = mostra ? 'Conteúdo educativo, em linguagem simples. Não substitui consulta com profissional de saúde. Imagens do <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>, com crédito em cada página.' : '';
}

function abrirDetalhe(id){
  var x = DADOS[aba].filter(function(i){return i.id===id})[0];
  if(!x) return;
  var h = '<span class="etiqueta">'+ROTULO[aba]+' &middot; '+esc(x.sis)+'</span><h2>'+esc(x.nome)+'</h2>';
  h += '<figure class="figura"><div class="moldura" id="moldura"></div><figcaption>'+esc(CRED[x.cred])+' <a href="'+pageUrl(x.img)+'" target="_blank" rel="noopener">Ver autor e licença</a></figcaption></figure>';
  h += '<div class="bloco"><h4>O que é</h4><p>'+esc(x.oque)+'</p></div>';
  h += '<div class="bloco"><h4>Por que é importante</h4><p>'+esc(x.imp)+'</p></div>';
  h += '<div class="bloco"><h4>Características</h4><ul>'+x.car.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul></div>';
  h += '<div class="bloco curio"><h4>Curiosidade</h4><p>'+esc(x.cur)+'</p></div>';
  $('#detCorpo').innerHTML = h;
  $('#detCat').textContent = ROTULO[aba];
  carregarImagem(x);
  $('#detalhe').hidden = false;
  $('#detalhe').scrollTop = 0;
  document.body.style.overflow='hidden';
  try{history.pushState({d:1},'')}catch(e){}
}

function carregarImagem(x){
  var m = $('#moldura');
  m.innerHTML = '<span style="color:var(--suave);font-size:15px">Carregando imagem...</span>';
  var im = new Image();
  im.alt = 'Ilustração: '+x.nome;
  im.referrerPolicy = 'no-referrer';
  im.onload = function(){ m.innerHTML=''; m.appendChild(im); };
  im.onerror = function(){
    m.innerHTML = '<div class="falha">Não foi possível carregar a imagem agora. Ela aparece quando o celular está com internet.<br><button id="tentar">Tentar de novo</button></div>';
    $('#tentar').onclick = function(){ carregarImagem(x); };
  };
  im.src = imgUrl(x.img);
}

/* ===== Quiz ===== */
var Q = {lista:[], i:0, acertos:0, travado:false};

function melhor(){ return parseInt(ler('corpo_melhor')||'0',10) }

function telaQuizInicio(){
  var m = melhor();
  var h = '<div class="quiz-caixa"><h2>Quiz do Corpo</h2><p>10 perguntas sobre órgãos, músculos e ossos. Cada resposta traz uma explicação curta.</p>';
  h += '<div class="placar"><div><b>'+m+' / 10</b>Seu melhor</div><div><b>'+QUIZ.length+'</b>Perguntas no total</div></div>';
  h += '<button class="btn amarelo" id="jogar">Começar o quiz</button></div>';
  $('#tela').innerHTML = h;
  rodape(false);
  $('#jogar').onclick = quizComecar;
}

function embaralhar(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}

function quizComecar(){
  Q.lista = embaralhar(QUIZ).slice(0,10).map(function(q){
    var idx = embaralhar(q.o.map(function(_,k){return k}));
    return {p:q.p, o:idx.map(function(k){return q.o[k]}), c:idx.indexOf(q.c), e:q.e};
  });
  Q.i=0; Q.acertos=0; Q.travado=false;
  quizPergunta();
}

function quizPergunta(){
  var q = Q.lista[Q.i];
  var h = '<div class="quiz-caixa"><div style="font-size:14px;color:var(--suave);font-weight:700">Pergunta '+(Q.i+1)+' de '+Q.lista.length+' &middot; Acertos: '+Q.acertos+'</div>';
  h += '<div class="progresso"><i style="width:'+(Q.i/Q.lista.length*100)+'%"></i></div>';
  h += '<div class="pergunta">'+esc(q.p)+'</div>';
  q.o.forEach(function(t,k){ h += '<button class="opcao" data-k="'+k+'">'+esc(t)+'</button>'; });
  h += '<div id="retorno"></div><div id="proximo"></div></div>';
  $('#tela').innerHTML = h;
  window.scrollTo(0,0);
  Q.travado=false;
}

function quizResponder(k){
  if(Q.travado) return;
  Q.travado=true;
  var q = Q.lista[Q.i];
  var ok = (k===q.c);
  if(ok) Q.acertos++;
  document.querySelectorAll('.opcao').forEach(function(b){
    var kk = parseInt(b.dataset.k,10);
    b.disabled = true;
    if(kk===q.c) b.classList.add('certa');
    else if(kk===k) b.classList.add('errada');
  });
  $('#retorno').innerHTML = '<div class="retorno '+(ok?'ok':'no')+'"><b>'+(ok?'Acertou!':'Não foi dessa vez.')+'</b> '+esc(q.e)+'</div>';
  var ultimo = (Q.i===Q.lista.length-1);
  $('#proximo').innerHTML = '<button class="btn" id="prox">'+(ultimo?'Ver resultado':'Próxima pergunta')+'</button>';
  $('#prox').onclick = function(){ if(ultimo) quizFim(); else {Q.i++; quizPergunta();} };
}

function quizFim(){
  var n = Q.acertos, total = Q.lista.length;
  var novo = n>melhor();
  if(novo) guardar('corpo_melhor', String(n));
  var msg = n>=9 ? 'Excelente! Você conhece bem o corpo humano.' : n>=7 ? 'Muito bom! Falta pouco para gabaritar.' : n>=5 ? 'Bom começo. Veja as fichas e tente de novo.' : 'Vale rever as fichas e jogar outra vez. Você chega lá!';
  var h = '<div class="quiz-caixa"><h2>Resultado</h2><div class="nota-final">'+n+' / '+total+'</div><p>'+msg+'</p>';
  if(novo) h += '<div class="retorno ok"><b>Novo recorde!</b> Seu melhor agora é '+n+'.</div>';
  h += '<button class="btn amarelo" id="denovo">Jogar de novo</button><button class="btn sec" id="fichas">Voltar às fichas</button></div>';
  $('#tela').innerHTML = h;
  window.scrollTo(0,0);
  $('#denovo').onclick = quizComecar;
  $('#fichas').onclick = function(){ trocarAba('orgaos') };
}

/* ===== Eventos ===== */

  if(c){ abrirDetalhe(c.dataset.id); return; }
  var o = e.target.closest('.opcao');
  if(o){ quizResponder(parseInt(o.dataset.k,10)); }
});
$('#abas').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(!$('#detalhe').hidden) fecharDetalhe();
  trocarAba(b.dataset.aba);
});
$('#voltar').addEventListener('click', function(){
  if(history.state && history.state.d){ history.back(); } else { fecharDetalhe(); }
});
window.addEventListener('popstate', function(){ if(!$('#detalhe').hidden) fecharDetalhe(); });
$('#busca').addEventListener('input', telaLista);

/* Arrasto lateral entre abas */
(function(){
  var ordem = ['orgaos','musculos','ossos','quiz'];
  var x0=0,y0=0,ativo=false;
  document.addEventListener('touchstart', function(e){
    if(!$('#detalhe').hidden || e.touches.length!==1) {ativo=false;return}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; ativo=true;
  },{passive:true});
  document.addEventListener('touchend', function(e){
    if(!ativo) return; ativo=false;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*2) return;
    var i = ordem.indexOf(aba) + (dx<0?1:-1);
    if(i>=0 && i<ordem.length) trocarAba(ordem[i]);
  },{passive:true});
})();

  setTimeout(function(){

      var d=document.createElement('div'); d.className='instala-dica'; d.id='dicaInstalar';
      d.innerHTML='Para ter o app no celular: toque nos três pontinhos do Chrome e depois em <b>Instalar app</b>. <button id="fechaDica" style="border:0;background:none;color:var(--marrom);font-weight:700">Entendi</button>';
      var t=$('#tela'); t.insertBefore(d,t.firstChild);
      $('#fechaDica').onclick=function(){d.remove();guardar('corpo_dica','1')};
    }
  },1500);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

trocarAba('orgaos');
</script>
