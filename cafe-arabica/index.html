<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Café Arábica</title>
<meta name="description" content="Café arábica: variedades, cultivo, tratos, defensivos, pragas, doenças e especificidades">
<meta name="theme-color" content="#2E5B2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--v:#2E5B2E;--v2:#3F7A3A;--am:#E8B531;--mar:#6B4226;--mar2:#8A5A36;--fundo:#F6F1E6;--txt:#22201B;--sub:#665E52;--linha:#E2D9C6}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:30;background:var(--v);color:#fff;padding:10px 12px 0;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topo{display:flex;align-items:center;gap:10px}
.topo img{width:38px;height:38px;border-radius:9px}
.topo h1{font-size:20px;margin:0;flex:1;line-height:1.15}
.topo h1 small{display:block;font-size:13px;font-weight:400;opacity:.85}
.topo button{border:0;border-radius:20px;font-weight:700;font-size:15px;padding:8px 12px}
#btnInstalar{background:var(--am);color:#2b2200}
#btnBusca{background:rgba(255,255,255,.16);color:#fff;font-size:18px;padding:6px 11px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;margin-top:8px;gap:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:#d6e6d2;font-size:15.5px;font-weight:700;padding:10px 11px 11px;border-bottom:4px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--am)}
main{max-width:700px;margin:0 auto;padding:0 12px 70px;min-height:70vh}
.intro{background:#fff;border:1px solid var(--linha);border-left:6px solid var(--am);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15.5px;color:var(--sub)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--linha);background:#fff;border-radius:18px;padding:7px 12px;font-size:15px;color:var(--txt);font-weight:600}
.chip[aria-pressed=true]{background:var(--mar);border-color:var(--mar);color:#fff}
.card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;margin:10px 0;display:block;width:100%;text-align:left;color:inherit;font:inherit}
.card .nome{font-size:19px;font-weight:800;color:var(--v)}
.card .sci{font-size:14px;color:var(--sub);font-style:italic}
.card p{margin:6px 0 0;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border-radius:10px;padding:2px 9px;font-size:13.5px;font-weight:700;background:#EFE7D6;color:var(--mar)}
.f-Resistente{background:#DCEFD5;color:#24611f}.f-Moderada{background:#FBEFC8;color:#7a5a00}.f-Suscetível{background:#F7DCD3;color:#9a2f12}
.fr-Vermelho{background:#F7D9D6;color:#9b2323}.fr-Amarelo{background:#FCEFC0;color:#7a5a00}
.linhaCard{display:flex;gap:12px;align-items:flex-start}
.emo{font-size:30px;line-height:1;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--fundo);border-radius:12px;flex:0 0 42px}
details{background:#fff;border:1px solid var(--linha);border-radius:14px;margin:10px 0;overflow:hidden}
summary{list-style:none;padding:13px 14px;font-weight:800;font-size:17.5px;color:var(--v);display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";margin-left:auto;color:var(--mar);transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
details ul{margin:0;padding:0 14px 12px 34px}
details li{margin:7px 0}
table{width:calc(100% - 24px);margin:0 12px 12px;border-collapse:collapse;font-size:15px}
td,th{border-top:1px solid #eee;padding:7px 5px;text-align:left;vertical-align:top}
th{color:var(--mar)}
.mes{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:11px 14px;margin:10px 0;display:flex;gap:12px}
.mes b{flex:0 0 92px;color:var(--mar);font-size:16.5px}
.mes.atual{border:2px solid var(--am);background:#FFFBEE}
.mes.atual b::after{content:" · agora";color:var(--v);font-size:13px}
.aviso{background:#FFF4E1;border:1px solid #EFCB86;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15px}
/* ficha */
#ficha{position:fixed;inset:0;z-index:50;background:var(--fundo);overflow-y:auto}
.fTopo{position:sticky;top:0;background:var(--v);color:#fff;padding:12px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:2}
.fTopo button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:16px;font-weight:700}
.fTopo h2{flex:1;margin:0;font-size:20px;line-height:1.2}
.fCorpo{max-width:700px;margin:0 auto;padding:6px 12px 50px}
.bloco{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;margin:10px 0}
.bloco h3{margin:0 0 6px;font-size:16px;color:var(--mar);text-transform:uppercase;letter-spacing:.3px}
.bloco p{margin:0}.bloco ul{margin:0;padding-left:20px}.bloco li{margin:5px 0}
.bloco.nivel{border-left:6px solid var(--am)}
.bloco.at{background:#FFF4E1;border-color:#EFCB86}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--fundo);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--sub);font-size:13px}
.kv b{font-size:16px}
/* busca */
#busca{position:fixed;inset:0;z-index:60;background:var(--fundo);overflow-y:auto}
#busca .fTopo input{flex:1;font-size:17px;padding:10px 12px;border-radius:10px;border:0}
.res small{display:block;color:var(--mar);font-weight:700;font-size:13px}
.vazio{text-align:center;color:var(--sub);padding:30px 10px}
#dicaInst{position:fixed;left:12px;right:12px;bottom:14px;z-index:70;background:#fff;border:2px solid var(--am);border-radius:14px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#dicaInst button{margin-top:10px;width:100%;background:var(--v);color:#fff;border:0;border-radius:10px;padding:10px;font-size:16px;font-weight:700}

.thumb{width:78px;height:78px;flex:0 0 78px;border-radius:12px;background:var(--fundo) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px}
.thumb.ok{font-size:0}
.cardVar{display:flex;gap:12px;align-items:flex-start}.cardVar>div:last-child{flex:1;min-width:0}
.galeria{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory;margin:10px 0 4px}
.galeria figure{margin:0;flex:0 0 100%;scroll-snap-align:center;position:relative;background:#fff;border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.galeria img{width:100%;height:260px;object-fit:cover;display:block;background:#e9e2d2}
.galeria figcaption{font-size:12.5px;color:var(--sub);padding:6px 10px}
.galeria .apagar{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:18px;padding:6px 11px;font-size:14px;font-weight:700}
.semFoto{background:#fff;border:1px dashed var(--linha);border-radius:14px;padding:18px;text-align:center;color:var(--sub);font-size:15px;margin:10px 0}
.btnFoto{display:block;text-align:center;background:var(--am);color:#2b2200;border-radius:12px;padding:11px;font-weight:800;font-size:16px;margin:6px 0 4px}
.dots{text-align:center;font-size:13px;color:var(--sub)}
details .secFoto{display:block;width:calc(100% - 28px);margin:0 14px 10px;height:190px;object-fit:cover;border-radius:12px;background:#e9e2d2}
details .cred{font-size:12px;color:var(--sub);margin:-6px 14px 10px}
footer{text-align:center;font-size:13px;color:var(--sub);padding:10px 12px 30px}
</style>
</head>

 if(aba==="var"){const f=VARIEDADES.filter(v=>(filtro.fer==="Todas"||v.fer===filtro.fer)&&(filtro.fruto==="Todos"||v.fruto===filtro.fruto)&&(filtro.mat==="Todas"||v.mat.includes(filtro.mat)));
  h=`<div class="intro">${VARIEDADES.length} cultivares de café arábica plantadas no Brasil. Toque para ver a ficha. Use os filtros:</div>`+
  chips("fer",["Todas","Resistente","Moderada","Suscetível"])+chips("fruto",["Todos","Vermelho","Amarelo"])+chips("mat",["Todas","Precoce","Média","Tardia"])+
  (f.length?f.map(cardVar).join(""):`<p class="vazio">Nenhuma variedade com esses filtros.</p>`)}
 else if(aba==="cul")h=`<div class="intro">Do clima à pós-colheita: o passo a passo para formar e conduzir a lavoura. Toque em cada tema.</div>`+secoes(CULTIVO);
 else if(aba==="cal"){const m=new Date().getMonth();h=`<div class="intro">O que fazer em cada mês (referência para SP e Sul de Minas; ajuste à sua região).</div>`+CALENDARIO.map((c,i)=>`<div class="mes${i===m?" atual":""}" ${i===m?'id="mesAtual"':""}><b>${c[0]}</b><span>${esc(c[1])}</span></div>`).join("")}
 else if(aba==="pra")h=`<div class="intro">Principais pragas do café arábica: como reconhecer, quando aparecem e como controlar.</div>`+PRAGAS.map(p=>cardPD(p,"pra")).join("");
 else if(aba==="doe")h=`<div class="intro">Principais doenças: sinais, época favorável e manejo.</div>`+DOENCAS.map(p=>cardPD(p,"doe")).join("");
 else if(aba==="def")h=`<div class="aviso">⚠️ Este app <b>não substitui a receita agronômica</b>. Doses e produtos: sempre da bula e do agrônomo.</div>`+secoes(DEFENSIVOS);
 else h=`<div class="intro">Especificidades do arábica: diferenças para o conilon, qualidade, geada e palavras da roça.</div>`+secoes(SAIBA);
 $("#tela").innerHTML=h;preencher($("#tela"));
 if(aba==="cal"){const e=$("#mesAtual");if(e)setTimeout(()=>e.scrollIntoView({block:"center"}),50)}}

$("#tela").onclick=e=>{const c=e.target.closest(".chip");if(c){filtro[c.dataset.f]=c.dataset.v;render();return}
 const k=e.target.closest(".card");if(k)abrir(k.dataset.tipo,k.dataset.id)};

function bloco(t,c,cls=""){return `<div class="bloco ${cls}"><h3>${t}</h3>${c}</div>`}
function lista(a){return `<ul>${a.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`}
let atual=null;
function abrir(tipo,id,semHist){let t="",h="";atual={tipo,id,fk:tipo==="var"?(FOTOS[id]?id:"_cafe"):id};
 if(tipo==="var"){const v=VARIEDADES.find(x=>x.id===id);if(!v)return;t=v.n;
  h=`<div class="kv"><div><small>Porte</small><b>${v.porte}</b></div><div><small>Fruto</small><b>${v.fruto}</b></div><div><small>Maturação</small><b>${v.mat}</b></div><div><small>Ferrugem</small><b>${v.fer}</b></div></div>`+
   bloco("Origem",`<p>${esc(v.o)}</p>`)+bloco("Como é",`<p>${esc(v.d)}</p>`)+bloco("Indicada para",`<p>${esc(v.ind)}</p>`)+bloco("⚠️ Atenção",lista(v.at),"at")+
   `<div class="aviso">O comportamento muda com a região. Confirme com o viveiro e o agrônomo antes de plantar.</div>`}
 else{const p=(tipo==="pra"?PRAGAS:DOENCAS).find(x=>x.id===id);if(!p)return;t=p.e+" "+p.n;
  h=bloco("Nome científico",`<p><i>${esc(p.c)}</i></p>`)+bloco("Onde ataca",`<p>${esc(p.onde)}</p>`)+bloco("Como reconhecer",`<p>${esc(p.rec)}</p>`)+bloco("Quando aparece",`<p>${esc(p.quando)}</p>`)+
   bloco("Dano",`<p>${esc(p.dano)}</p>`)+bloco("Monitoramento",`<p>${esc(p.mon)}</p>`)+(p.nivel?bloco("Nível de controle",`<p>${esc(p.nivel)}</p>`,"nivel"):"")+bloco("Controle",lista(p.ctl))+
   `<div class="aviso">Produtos e doses só com receituário agronômico. Consulte os registrados para café no AGROFIT.</div>`}
 $("#fTit").textContent=t;$("#fCorpo").innerHTML=`<div id="gal"></div><label class="btnFoto" for="inFoto">📷 Tirar ou escolher minha foto</label>`+h;galeria();$("#ficha").hidden=false;$("#ficha").scrollTop=0;
 if(!semHist)history.pushState({f:1},"")}
function fechar(){if(!$("#ficha").hidden||!$("#busca").hidden)history.back()}
$("#fVoltar").onclick=fechar;$("#bVoltar").onclick=fechar;
addEventListener("popstate",()=>{if(!$("#ficha").hidden){$("#ficha").hidden=true;return}$("#busca").hidden=true});

// ===== FOTOS =====
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const LSs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const refMem={};
async function fotoRef(fk){if(!FOTOS[fk])return null;if(refMem[fk]!==undefined)return refMem[fk];
 const c=LS("cafeFoto:"+fk);if(c&&c.u){refMem[fk]=c;return c}if(c&&c.none&&Date.now()-c.none<864e5)return null;
 if(!navigator.onLine)return null;
 for(const cand of FOTOS[fk]){const[lg,tt]=cand.split(":");
  try{const r=await fetch(`https://${lg}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(tt)}`);if(!r.ok)continue;const j=await r.json();
   if(j.type==="disambiguation")continue;let u=null;
   if(j.originalimage&&j.originalimage.width<=1100)u=j.originalimage.source;else if(j.thumbnail)u=j.thumbnail.source.replace(/\/(\d+)px-/,"/800px-");
   if(!u||/\.svg/i.test(u)&&!/\.png$/i.test(u))continue;
   const v={u,cred:"Foto: Wikimedia Commons (licença livre) · "+(j.title||tt)};refMem[fk]=v;LSs("cafeFoto:"+fk,v);return v}catch(e){}}
 LSs("cafeFoto:"+fk,{none:Date.now()});refMem[fk]=null;return null}
// fotos do usuário (IndexedDB)
let dbp=null;function db(){return dbp=dbp||new Promise((ok,er)=>{const r=indexedDB.open("cafeArabicaFotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id",autoIncrement:true}).createIndex("k","k");r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)})}
async function minhas(k){const d=await db();return new Promise(ok=>{const q=d.transaction("f").objectStore("f").index("k").getAll(k);q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([])})}
async function salvarMinha(k,blob){const d=await db();return new Promise(ok=>{const t=d.transaction("f","readwrite");t.objectStore("f").add({k,blob,dt:Date.now()});t.oncomplete=ok})}
async function apagarMinha(id){const d=await db();return new Promise(ok=>{const t=d.transaction("f","readwrite");t.objectStore("f").delete(id);t.oncomplete=ok})}
const urls=[];function burl(b){const u=URL.createObjectURL(b);urls.push(u);return u}
async function preencher(raiz){
 for(const el of raiz.querySelectorAll(".thumb")){const m=await minhas(el.dataset.own).catch(()=>[]);
  if(m.length){el.style.backgroundImage=`url(${burl(m[m.length-1].blob)})`;el.classList.add("ok");continue}
  fotoRef(el.dataset.fk).then(f=>{if(f){const i=new Image();i.onload=()=>{el.style.backgroundImage=`url("${f.u}")`;el.classList.add("ok")};i.src=f.u}})}
 for(const im of raiz.querySelectorAll("img.secFoto")){fotoRef(im.dataset.fk).then(f=>{if(!f)return;im.onload=()=>{im.hidden=false;const c=im.nextElementSibling;c.textContent=f.cred;c.hidden=false};im.src=f.u})}}
async function galeria(){if(!atual)return;const k=atual.tipo+":"+atual.id,g=$("#gal");if(!g)return;
 const m=await minhas(k).catch(()=>[]);let h=m.slice().reverse().map(x=>`<figure><img src="${burl(x.blob)}" alt=""><button class="apagar" data-del="${x.id}">🗑 Apagar</button><figcaption>📷 Minha foto · ${new Date(x.dt).toLocaleDateString("pt-BR")}</figcaption></figure>`).join("");
 const f=await fotoRef(atual.fk);
 if(f)h+=`<figure><img src="${f.u}" alt="" onerror="this.parentNode.remove()"><figcaption>${esc(f.cred)}${atual.fk==="_cafe"?" (foto geral do café arábica)":""}</figcaption></figure>`;
 const n=m.length+(f?1:0);
 g.innerHTML=n?`<div class="galeria">${h}</div>${n>1?`<div class="dots">⇠ arraste para ver ${n} fotos ⇢</div>`:""}`:`<div class="semFoto">Sem foto ainda${navigator.onLine?"":" (abra com internet para baixar a foto de referência)"}.<br>Tire a sua no campo com o botão abaixo.</div>`}
$("#fCorpo").addEventListener("click",async e=>{const b=e.target.closest("[data-del]");if(!b)return;if(!confirm("Apagar esta foto?"))return;await apagarMinha(+b.dataset.del);galeria();render()});
$("#inFoto").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f||!atual)return;
 try{const bm=await createImageBitmap(f);const k=Math.min(1,1000/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  const blob=await new Promise(ok=>c.toBlob(ok,"image/webp",.82));await salvarMinha(atual.tipo+":"+atual.id,blob||f)}catch(err){await salvarMinha(atual.tipo+":"+atual.id,f)}
 galeria();render()};
// baixa todas as fotos de referência para usar sem internet
async function baixarTodas(){if(!navigator.onLine)return;for(const fk of Object.keys(FOTOS)){const f=await fotoRef(fk);if(f)await new Promise(ok=>{const i=new Image();i.onload=i.onerror=ok;i.src=f.u})}}
addEventListener("load",()=>setTimeout(baixarTodas,2500));
addEventListener("online",()=>{Object.keys(refMem).forEach(k=>{if(refMem[k]===null)delete refMem[k]});baixarTodas()});

// busca geral
function todos(){const r=[];
 VARIEDADES.forEach(v=>r.push({cat:"Variedade",t:v.n,s:v.o,txt:[v.n,v.o,v.d,v.ind,v.fer,v.fruto,v.mat,v.at.join(" ")].join(" "),go:()=>abrir("var",v.id,1)}));
 PRAGAS.forEach(p=>r.push({cat:"Praga",t:p.e+" "+p.n,s:p.c,txt:Object.values(p).flat().join(" "),go:()=>abrir("pra",p.id,1)}));
 DOENCAS.forEach(p=>r.push({cat:"Doença",t:p.e+" "+p.n,s:p.c,txt:Object.values(p).flat().join(" "),go:()=>abrir("doe",p.id,1)}));
 [["Cultivo",CULTIVO,"cul"],["Defensivos",DEFENSIVOS,"def"],["Saiba mais",SAIBA,"sai"]].forEach(([c,l,a])=>l.forEach(s=>r.push({cat:c,t:s.e+" "+s.t,s:"",txt:s.t+" "+(s.x||[]).join(" ")+" "+(s.tab||[]).flat().join(" "),go:()=>{history.back();setTimeout(()=>{ir(a);abrirSecao(s.t)},60)}})));
 CALENDARIO.forEach(c=>r.push({cat:"Calendário",t:"📅 "+c[0],s:c[1],txt:c.join(" "),go:()=>{history.back();setTimeout(()=>ir("cal"),60)}}));
 return r}
let IDX=null,achados=[];
function abrirSecao(t){const d=[...document.querySelectorAll("#tela details")].find(x=>x.querySelector("summary").textContent.includes(t));if(d){d.open=true;d.scrollIntoView({block:"start"});scrollBy(0,-130)}}
$("#btnBusca").onclick=()=>{IDX=IDX||todos();$("#busca").hidden=false;history.pushState({b:1},"");$("#bq").value="";buscar();setTimeout(()=>$("#bq").focus(),50)};
function buscar(){const q=norm($("#bq").value.trim());
 if(q.length<2){$("#bRes").innerHTML=`<p class="vazio">Digite pelo menos 2 letras.<br>Ex.: broca, ferrugem, Catuaí, poda, EPI.</p>`;return}
 const ps=q.split(/\s+/);achados=IDX.filter(i=>{const t=norm(i.txt);return ps.every(p=>t.includes(p))});
 $("#bRes").innerHTML=achados.length?achados.map((a,i)=>`<button class="card res" data-i="${i}"><small>${a.cat}</small><div class="nome">${esc(a.t)}</div>${a.s?`<div class="sci">${esc(a.s)}</div>`:""}</button>`).join(""):`<p class="vazio">Nada encontrado.</p>`}
$("#bq").oninput=buscar;
$("#bRes").onclick=e=>{const b=e.target.closest(".res");if(!b)return;const a=achados[+b.dataset.i];
 if(a.cat==="Variedade"||a.cat==="Praga"||a.cat==="Doença"){$("#busca").hidden=true;a.go();history.replaceState({f:1},"")}else a.go()};

// arrasto lateral entre abas
let x0=null,y0=0;
$("#tela").addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
$("#tela").addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
 if(Math.abs(dx)<28||Math.abs(dx)<Math.abs(dy)*1.3)return;const i=ABAS.findIndex(a=>a[0]===aba);const j=dx<0?i+1:i-1;if(j>=0&&j<ABAS.length)ir(ABAS[j][0])},{passive:true});

// instalar
let adiado=null;const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(!standalone())$("#btnInstalar").hidden=false;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();adiado=e;if(!standalone())$("#btnInstalar").hidden=false});
addEventListener("appinstalled",()=>{$("#btnInstalar").hidden=true});
$("#btnInstalar").onclick=async()=>{if(adiado){adiado.prompt();try{await adiado.userChoice}catch(e){}adiado=null}else $("#dicaInst").hidden=false};
$("#dicaOk").onclick=()=>$("#dicaInst").hidden=true;
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

abas();render();
</script>
