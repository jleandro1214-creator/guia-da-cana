<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guia da Cana</title>
<meta name="theme-color" content="#1b5e20">
<meta name="description" content="Pragas, doenças, plantas daninhas, calculadora, anotações de campo, fazendas e talhões, monitoramento e relatórios da cana-de-açúcar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-apple.png">
<style>
  /* Layout: cabeçalho fixo com busca geral, painel de módulos, barra inferior com menu — feito para uso no campo, ao sol */
  :root{
    --bg:#f2f5f0; --card:#ffffff; --ink:#132112; --soft:#4d5d4a; --line:#d2dccd;
    --accent:#2e7d32; --accent-strong:#1b5e20; --tint:#e2efdf; --on-accent:#ffffff;
    --ok:#2e7d32; --ok-tint:#e3f1e1; --warn:#a1461a; --warn-tint:#fbe5d9; --info:#6b5a12; --info-tint:#f6efcf; --mid:#1f5a8a; --mid-tint:#e1edf7;
    --head-bg:#1b5e20; --head-ink:#ffffff; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f150e; --card:#192318; --ink:#edf3ea; --soft:#a9b9a5; --line:#2b3a29;
      --accent:#6fcf74; --accent-strong:#9adf9c; --tint:#1f2e1d; --on-accent:#0c1f0d;
      --ok:#7fd383; --ok-tint:#1d2a1b; --warn:#f2a37b; --warn-tint:#3a2318; --info:#e8d27a; --info-tint:#2e2a14; --mid:#8cc4f0; --mid-tint:#16283a;
      --head-bg:#1e3d1f; --head-ink:#eef3ea; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f150e; --card:#192318; --ink:#edf3ea; --soft:#a9b9a5; --line:#2b3a29;
    --accent:#6fcf74; --accent-strong:#9adf9c; --tint:#1f2e1d; --on-accent:#0c1f0d;
    --ok:#7fd383; --ok-tint:#1d2a1b; --warn:#f2a37b; --warn-tint:#3a2318; --info:#e8d27a; --info-tint:#2e2a14; --mid:#8cc4f0; --mid-tint:#16283a;
    --head-bg:#1e3d1f; --head-ink:#eef3ea; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;overflow-x:clip;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;}
  a{color:var(--accent-strong);}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #offlineBadge{display:none;background:#5d4037;color:#fff;text-align:center;font-size:13px;padding:6px 8px;}
  #offlineBadge.show{display:block;}
  header.app{position:sticky;top:0;z-index:20;background:var(--head-bg);color:var(--head-ink);box-shadow:0 2px 8px rgba(0,0,0,.2);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));}
  .hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;}
  .hrow h1{margin:0;font-size:21px;font-weight:800;flex:1;min-width:0;}
  .hrow h1 a{color:inherit;text-decoration:none;}
  #openInstall{flex-shrink:0;background:rgba(255,255,255,.14);color:var(--head-ink);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 13px;font-size:14px;font-weight:700;}
  .busca{max-width:760px;margin:10px auto 0;position:relative;}
  .busca input{width:100%;border:none;border-radius:12px;padding:12px 14px 12px 42px;font-size:17px;background:rgba(255,255,255,.96);color:#132112;}
  .busca::before{content:"🔎";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;}
  main{padding:14px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto;}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));}
  nav.bottom a,nav.bottom button{flex:1;text-align:center;text-decoration:none;color:var(--soft);font-size:12.5px;font-weight:700;padding:6px 2px;border-radius:10px;background:none;border:none;}
  nav.bottom span{display:block;font-size:22px;line-height:1.2;}
  nav.bottom .on{color:var(--accent-strong);background:var(--tint);}
  #menu{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;}
  #menu .sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow-y:auto;}
  h2.tit{font-size:22px;margin:4px 0 4px;text-wrap:balance;}
  p.sub{margin:0 0 14px;color:var(--soft);font-size:15px;line-height:1.45;}
  .sec-t{font-size:14px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 10px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mod{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 13px;text-decoration:none;color:var(--ink);min-height:118px;}
  .mod .e{font-size:30px;} .mod b{font-size:17px;} .mod small{font-size:13.5px;color:var(--soft);line-height:1.35;}
  .mod .ext{position:absolute;top:10px;right:10px;font-size:12px;color:var(--soft);}
  .lista-mod{display:flex;flex-direction:column;gap:12px;}
  .mod.lin{flex-direction:row;align-items:center;gap:14px;min-height:92px;padding:16px;}
  .mod.lin .e{font-size:38px;width:52px;text-align:center;flex:none;} .mod.lin .tx{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
  .mod.lin b{font-size:19px;} .mod.lin small{font-size:14.5px;}
  .mod.lin .ext,.mod.lin .cnt,.mod.lin .chev{position:static;flex:none;font-size:22px;color:var(--soft);}
  .mod.lin .cnt{font-size:14px;color:#fff;}
  .mod .cnt{position:absolute;top:10px;right:10px;background:var(--warn);color:#fff;border-radius:999px;font-size:12.5px;font-weight:800;padding:2px 8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h3{margin:0 0 6px;font-size:19px;}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;width:100%;text-align:left;color:var(--ink);text-decoration:none;}
  .thumb{width:76px;height:76px;border-radius:12px;flex-shrink:0;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;position:relative;}
  .thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .item .t{flex:1;min-width:0;} .item h4{margin:0 0 3px;font-size:18px;} .item p{margin:0;font-size:14.5px;color:var(--soft);}
  .item .sci{font-style:italic;} .item .chev{font-size:22px;color:var(--soft);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;text-decoration:none;}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-items:end;}
  .fields .full{grid-column:1/-1;} .fields>div{min-width:0;}
  .lb{display:block;font-size:14.5px;font-weight:700;color:var(--soft);margin:0 0 5px;}
  input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:17px;background:var(--card);color:var(--ink);}
  textarea.f{min-height:96px;resize:vertical;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;padding:13px 16px;font-size:16.5px;font-weight:700;text-decoration:none;cursor:pointer;}
  .btn.sec{background:var(--card);color:var(--accent-strong);border:1px solid var(--line);}
  .btn.full{width:100%;} .btn.wa{background:#25D366;color:#fff;} .btn.peq{padding:8px 11px;font-size:14.5px;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .b-ok{background:var(--ok-tint);color:var(--ok);} .b-ref{background:var(--info-tint);color:var(--info);} .b-warn{background:var(--warn-tint);color:var(--warn);} .b-mid{background:var(--mid-tint);color:var(--mid);}
  .info{background:var(--info-tint);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:14px;}
  .aviso{background:var(--warn-tint);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:14px;}
  .ficha h4{margin:16px 0 6px;font-size:17px;color:var(--accent-strong);}
  .ficha ul{margin:0;padding-left:22px;line-height:1.55;} .ficha p{line-height:1.55;}
  .ficha dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:8px 0;} .ficha dt{color:var(--soft);font-weight:700;} .ficha dd{margin:0;}
  .galeria{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 8px;padding:0 16px;scrollbar-width:none;}
  .galeria::-webkit-scrollbar{display:none;}
  .galeria figure{flex:0 0 100%;scroll-snap-align:center;margin:0;border-radius:12px;overflow:hidden;background:var(--tint);}
  .galeria img{display:block;width:100%;height:260px;object-fit:cover;cursor:zoom-in;}
  .galeria figcaption{font-size:13.5px;color:var(--soft);padding:8px 10px;}
  .midias{display:flex;gap:8px;flex-wrap:wrap;}
  .midias .m{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#000;}
  .midias .m img,.midias .m video{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
  .midias .m button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:999px;width:28px;height:28px;font-size:14px;}
  .midias .m .v{position:absolute;left:4px;bottom:4px;color:#fff;font-size:12px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 5px;}
  .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;}
  table.t{width:100%;border-collapse:collapse;font-size:15px;} table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;}
  table.t th{color:var(--soft);font-size:13.5px;} .tw{overflow-x:auto;}
  .stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .stat b{display:block;font-size:26px;color:var(--accent-strong);font-variant-numeric:tabular-nums;} .stat span{font-size:14px;color:var(--soft);}
  .bars{display:grid;gap:8px;} .bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14.5px;}
  .bar i{display:block;height:14px;border-radius:7px;background:var(--accent);min-width:4px;} .bar b{font-variant-numeric:tabular-nums;}
  .vazio{text-align:center;color:var(--soft);padding:24px 10px;font-size:16px;line-height:1.45;}
  .hist{border-left:3px solid var(--line);padding-left:12px;margin-left:6px;}
  .hist .ev{position:relative;margin-bottom:12px;} .hist .ev::before{content:"";position:absolute;left:-19px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent);}
  .hist .ev small{color:var(--soft);}
  #zoom{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;}
  #zoom img,#zoom video{max-width:100%;max-height:100%;object-fit:contain;}
  #zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:999px;width:44px;height:44px;font-size:22px;z-index:2;}
  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:700;z-index:80;max-width:90vw;text-align:center;}
  #toast.erro{background:var(--warn);color:#fff;}
  #installSheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;}
  #installSheet .sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));}
  #installSheet h2{margin:0 0 6px;font-size:20px;} #installSheet p{margin:0 0 12px;font-size:15.5px;color:var(--soft);line-height:1.45;}
  #installSheet ol{margin:0;padding-left:22px;font-size:16px;line-height:1.55;}
  .printonly{display:none;}
  @page{size:A4;margin:12mm;}
  @media print{ header.app,nav.bottom,#offlineBadge,.noprint,.btns,#menu{display:none!important;} .printonly{display:block;}
    body{background:#fff;color:#000;font-size:11.5pt;} main{padding:0;max-width:none;} .card{border:1px solid #999;break-inside:avoid;} .midias .m{width:120px;height:120px;} }
</style>
</head>
<body>
<div id="offlineBadge">Sem conexão — o guia e os registros continuam funcionando</div>
<header class="app" id="appHead">
  <div class="hrow"><h1><a href="#/">🌿 Guia da Cana</a></h1><button id="openInstall" type="button">📲 Instalar app</button></div>
  <div class="busca"><input id="q" type="search" placeholder="Buscar praga, doença, daninha ou anotação…" autocomplete="off" aria-label="Busca geral"></div>
</header>
<main id="main"></main>
<nav class="bottom" aria-label="Menu principal">
  <a href="#/" data-r="home"><span>🏠</span>Início</a>
  <a href="#/pragas" data-r="pragas"><span>🐛</span>Pragas</a>
  <a href="#/doencas" data-r="doencas"><span>🍂</span>Doenças</a>
  <a href="#/notas" data-r="notas"><span>📝</span>Anotações</a>
  <a href="#/rel" data-r="rel"><span>📊</span>Relatórios</a>
</nav>
<div id="zoom" hidden><button type="button" aria-label="Fechar">✕</button><div id="zoomIn"></div></div>
<div id="toast" hidden></div>
<div id="installSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="instTitle">
    <h2 id="instTitle">Instalar o Guia da Cana</h2>
    <p id="instTxt">Depois de instalado, abre pelo ícone na tela do celular e funciona sem internet.</p>
    <ol><li>Toque nos <b>3 pontinhos ⋮</b> do Chrome.</li><li>Toque em <b>Instalar app</b>.</li></ol>
    <button class="btn full" id="closeInstall" type="button" style="margin-top:16px">Entendi</button>
  </div>
</div>
<datalist id="listaFazendas"></datalist><datalist id="listaTalhoes"></datalist>
<script>
/* Se algo falhar ao carregar (ex.: arquivo antigo guardado no celular), mostra aviso com botão para atualizar */
window.addEventListener("error",function(e){ if(document.getElementById("falhaApp")) return; var d=document.createElement("div"); d.id="falhaApp";
  d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#fff3cd;color:#5d4200;border:2px solid #e0b400;border-radius:14px;padding:14px;font:600 16px system-ui";
  d.innerHTML='O app não carregou direito (versão antiga guardada no celular).<br><button style="margin-top:10px;font:700 17px system-ui;padding:12px 16px;border-radius:12px;border:none;background:#1b5e20;color:#fff;width:100%">🔄 Atualizar o app</button>';
  d.querySelector("button").onclick=function(){ Promise.resolve(window.caches?caches.keys().then(function(k){return Promise.all(k.filter(function(x){return x.indexOf("guia-cana-")===0}).map(function(x){return caches.delete(x)}))}):0).then(function(){ location.reload(); }); };
  document.body.appendChild(d); });
</script>
<script src="daninhas/fazendas.js?v=6"></script>
<script src="daninhas/dados.js?v=6"></script>
<script src="base.js?v=6"></script>
<script src="fichas.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
