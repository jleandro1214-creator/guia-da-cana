<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca do Crescimento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b4426">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--verde:#1f5f3a;--verde2:#2f7a4d;--verdeclaro:#e3efe5;--amarelo:#f2b705;--amareloclaro:#fdf1c7;--marrom:#6b4426;--marrom2:#4e301a;--marromclaro:#efe3d6;--creme:#f7f3e8;--card:#fffdf7;--tx:#2a2218;--mut:#6a5f50;--linha:#dcd3c0;--erro:#a3361a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--creme);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--marrom);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 14px}
.topo{display:flex;align-items:center;gap:10px}
.topo img{width:40px;height:40px;border-radius:10px}
.topo h1{margin:0;font-size:21px;flex:1;line-height:1.2}
.topo small{display:block;font-size:13px;font-weight:400;opacity:.88}
.tag-esb{background:var(--amarelo);color:#3a2a00;font:800 12px system-ui;padding:5px 9px;border-radius:99px}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:21px;margin:20px 0 6px;line-height:1.25}
h3{font-size:17px;margin:16px 0 4px;color:var(--marrom)}
.mut{color:var(--mut);font-size:15px}
.card{background:var(--card);border:2px solid var(--linha);border-radius:18px;padding:16px;margin-top:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 12px;font:700 17px system-ui;background:var(--verde);color:#fff;min-height:52px;margin-top:10px;text-align:center;text-decoration:none}
.btn.am{background:var(--amarelo);color:#3a2a00}.btn.mr{background:var(--marrom)}.btn.lin{background:transparent;border:2px solid var(--linha);color:var(--tx)}
/* capas originais */
.capa{position:relative;border-radius:6px 14px 14px 6px;padding:14px 12px 12px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 6px 14px rgba(60,40,20,.25);overflow:hidden}
.capa::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08)}
.capa .ct{font:800 17px/1.15 Georgia,serif;position:relative;z-index:1}
.capa .ca{font:600 12px system-ui;opacity:.9;position:relative;z-index:1}
.capa svg{width:46px;height:46px;position:relative;z-index:1}
.capa.g{width:150px;height:215px}.capa.g .ct{font-size:21px}.capa.g svg{width:64px;height:64px}
.capa.p{width:100%;aspect-ratio:2/3}
.capa.off{filter:grayscale(.55) brightness(.92)}
.capa .lock{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);border-radius:99px;padding:2px 8px;font:800 11px system-ui;z-index:2}
.capa.p .ct{font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.capa.p{padding:10px 8px 10px 14px}.capa.p svg{width:38px;height:38px}
/* destaque do mês */
.mes{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-radius:20px;padding:16px;margin-top:4px}
.mes .info{flex:1}.mes .k{font:800 12px system-ui;letter-spacing:.06em;color:var(--amarelo)}
.mes h2{margin:4px 0;color:#fff;font-size:22px}
.mes .btn{background:var(--amarelo);color:#3a2a00;margin-top:12px;min-height:46px;padding:10px}
.prog{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--amarelo)}
.estante{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.estante .lv{cursor:pointer}.estante .lv small{display:block;font-size:12px;color:var(--mut);margin-top:4px;line-height:1.25}
.trilho{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory}
/* livro aberto */
.voltar{background:none;border:0;font:700 16px system-ui;color:var(--verde2);padding:6px 0}
.livro-top{display:flex;gap:14px;align-items:flex-end}
.livro-top .info{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--verdeclaro);color:var(--verde);font:700 13px system-ui;padding:4px 10px;border-radius:99px}
.secs{display:flex;gap:6px;overflow-x:auto;margin:16px -14px 0;padding:0 14px 6px;position:sticky;top:0;background:var(--creme);z-index:3;padding-top:8px}
.secs button{flex:0 0 auto;border:2px solid var(--linha);background:#fff;border-radius:99px;padding:8px 14px;font:700 15px system-ui;color:var(--mut)}
.secs button.on{background:var(--marrom);border-color:var(--marrom);color:#fff}
.secs button.ok::after{content:" ✓";color:var(--verde2)}.secs button.on.ok::after{color:var(--amarelo)}
/* cartões de 5 minutos */
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -14px 0;padding:4px 14px 12px}
.cards::-webkit-scrollbar{display:none}
.ic{flex:0 0 86%;scroll-snap-align:center;background:var(--card);border:2px solid var(--linha);border-radius:20px;padding:18px;min-height:330px;display:flex;flex-direction:column}
.ic .n{font:800 13px system-ui;color:var(--verde2);letter-spacing:.05em}
.ic h4{margin:6px 0 8px;font:700 23px/1.2 Georgia,serif;color:var(--marrom)}
.ic p{margin:0 0 8px}
.ic .ex{margin-top:auto;background:var(--verdeclaro);border-radius:12px;padding:10px 12px;font-size:15px}
.ic .ex b{color:var(--verde)}
.ic.fim{background:var(--verde);color:#fff;border-color:var(--verde);justify-content:center;text-align:center}.ic.fim h4{color:var(--amarelo)}
.pontos{display:flex;justify-content:center;gap:6px}.pontos i{width:8px;height:8px;border-radius:50%;background:var(--linha)}.pontos i.on{background:var(--marrom);width:22px;border-radius:99px}
.num-grande{font:800 46px/1 Georgia,serif;color:var(--verde);margin:6px 0}
/* ferramentas */
.fer{background:var(--card);border:2px solid var(--linha);border-left:8px solid var(--amarelo);border-radius:16px;padding:14px;margin-top:12px}
.fer h4{margin:0 0 4px;font-size:19px}
.fer ol{margin:8px 0 0;padding-left:22px}.fer li{margin:4px 0}
.fer .campo{background:var(--marromclaro);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.fer .campo b{color:var(--marrom)}
/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--linha);border-radius:14px;padding:12px;margin-top:10px;cursor:pointer}
.chk .bx{flex:0 0 30px;height:30px;border-radius:8px;border:3px solid var(--verde2);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.chk.on{background:var(--verdeclaro);border-color:#bfd8c4}.chk.on .bx{background:var(--verde2)}
.chk small{display:block;color:var(--mut);font-size:14px}
/* quiz */
.qz{background:var(--card);border:2px solid var(--linha);border-radius:18px;padding:16px;margin-top:12px}
.qz .qn{font:800 13px system-ui;color:var(--verde2)}
.qz h4{margin:6px 0 10px;font-size:19px;line-height:1.35}
.op{display:block;width:100%;text-align:left;border:2px solid var(--linha);background:#fff;border-radius:12px;padding:12px;font:600 16px system-ui;color:var(--tx);margin-top:8px}
.op.cer{background:var(--verdeclaro);border-color:var(--verde2)}.op.err{background:#f6dcd3;border-color:var(--erro)}
.exp{margin-top:10px;font-size:15px;background:var(--amareloclaro);border-radius:12px;padding:10px 12px}
.placar{text-align:center}.placar .num-grande{font-size:56px}
.lembrar{font:600 22px/1.4 Georgia,serif;background:var(--amareloclaro);border-left:6px solid var(--amarelo);border-radius:0 14px 14px 0;padding:16px;margin-top:12px}
textarea{width:100%;min-height:120px;margin-top:8px;border:2px solid var(--linha);border-radius:12px;padding:10px;font:17px system-ui;background:#fff;color:var(--tx)}
/* plano */
.pl{background:var(--card);border:2px solid var(--linha);border-radius:16px;padding:14px;margin-top:10px}
.pl h4{margin:0 0 4px;font-size:18px;color:var(--verde)}
.pl ul{margin:6px 0 0;padding-left:20px}.pl li{margin:4px 0}
.preco{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.preco div{background:var(--verdeclaro);border-radius:12px;padding:10px;text-align:center}.preco b{display:block;font-size:22px;color:var(--verde)}
.linha-t{border-left:4px solid var(--amarelo);margin:10px 0 0 8px;padding-left:14px}
.linha-t div{position:relative;margin-bottom:12px}.linha-t div::before{content:"";position:absolute;left:-23px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--verde2);border:3px solid var(--creme)}
.nota-esb{background:var(--amareloclaro);border:2px dashed var(--amarelo);border-radius:14px;padding:12px;margin-top:14px;font-size:15px}
.inst{display:flex;gap:10px;align-items:center;border:2px dashed var(--amarelo);background:var(--amareloclaro);border-radius:14px;padding:10px 12px;margin-top:16px}
.inst span{flex:1;font-size:15px}.inst .btn{width:auto;margin:0;padding:10px 14px;min-height:44px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--linha);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;font:700 12px system-ui;color:var(--mut);padding:6px 1px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:21px}
nav button[aria-current=true]{background:var(--marromclaro);color:var(--marrom)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;max-width:90%;text-align:center}
</style>
</head>

const $=s=>document.querySelector(s);
const LS={g(k,d){try{const v=localStorage.getItem("bib_"+k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem("bib_"+k,JSON.stringify(v))}catch(e){}}};
let st=LS.g("st",{});/* st[id]={lidos:[..secs], chk:[], quiz:{acertos,feito}, nota:"" } */
let aba="inicio", livro=null, sec="ideias", qi=0, qAc=0, qResp=null;
const SECS=[["ideias","⚡ 5 minutos"],["ferr","🛠️ Ferramentas"],["aplicar","✅ Aplicar"],["quiz","🎯 Quiz"],["notas","✍️ Notas"]];
const S=id=>st[id]||(st[id]={lidos:[],chk:[],quiz:null,nota:""});
const salva=()=>LS.s("st",st);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
function pct(id){const s=st[id];if(!s)return 0;return Math.round(s.lidos.length/SECS.length*100)}
function capa(l,cls){return `<div class="capa ${cls} ${l.ok?"":"off"}" style="background:${l.cor}"><span class="ca">${l.mes}</span>${IC[l.ic]}<div><div class="ct">${l.t}</div><div class="ca">${l.a}</div></div>${l.ok?"":`<div class="lock">🔒</div>`}</div>`}
function marcaLido(id,s){const x=S(id);if(!x.lidos.includes(s)){x.lidos.push(s);salva()}}

  else{const q=c.quiz[qi];body=`<div class="qz"><span class="qn">PERGUNTA ${qi+1} DE ${c.quiz.length}</span><h4>${q.q}</h4>${q.o.map((o,i)=>`<button class="op ${qResp!==null?(i===q.c?"cer":i===qResp?"err":""):""}" data-o="${i}" ${qResp!==null?"disabled":""}>${o}</button>`).join("")}${qResp!==null?`<div class="exp">${qResp===q.c?"✅ Certo!":"❌ Não foi dessa vez."} ${q.e}</div><button class="btn" id="prox">${qi+1<c.quiz.length?"Próxima →":"Ver resultado"}</button>`:""}</div>`}
 }
 else{body=`<div class="lembrar">“${c.frase}”</div><h3>✍️ O que eu vou levar deste livro</h3><textarea id="nota" placeholder="Escreva com suas palavras: o que mais te pegou e onde vai usar na frente ou em casa...">${esc(s.nota)}</textarea><p class="mut">Salva sozinho. Suas anotações de todos os livros ficam na aba Anotações.</p>
 <div class="card"><b>🧭 Por que este livro para quem trabalha no campo?</b><p style="margin:6px 0 0">${c.porque}</p></div>

 return `<button class="voltar" id="voltar">← Estante</button>
 <div class="livro-top">${capa(l,"g")}<div class="info"><div class="mut">${l.mes} · ${l.tema}</div><h2 style="margin:4px 0">${l.t}</h2><div class="mut">${l.a}</div><div class="chips"><span class="chip">⏱️ ${l.min} min</span><span class="chip">${pct(l.id)}% feito</span></div></div></div>

 v.innerHTML=livro?tLivro():aba==="inicio"?tInicio():aba==="estante"?tEstante():aba==="notas"?tNotas():tPlano();
 v.querySelectorAll("[data-l]").forEach(e=>e.onclick=()=>{livro=e.dataset.l;sec="ideias";qi=0;qAc=0;qResp=null;render();scrollTo(0,0)});
 const vt=$("#voltar");if(vt)vt.onclick=()=>{livro=null;render();scrollTo(0,0)};
 v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sec=b.dataset.s;if(sec==="quiz"&&qi>=5){}render()});
 v.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{sec=b.dataset.ir;render();scrollTo(0,0)});
 if(livro){
  const l=livro,c=CT[l];
  if(sec==="ideias"){const cs=$("#cards"),ps=document.querySelectorAll("#pontos i");cs.onscroll=()=>{const w=cs.firstElementChild.offsetWidth+12,i=Math.round(cs.scrollLeft/w);ps.forEach((p,j)=>p.classList.toggle("on",j===i));if(i>=c.cards.length-1){marcaLido(l,"ideias")}}}
  if(sec==="ferr")marcaLido(l,"ferr");
  if(sec==="aplicar"){v.querySelectorAll(".chk").forEach(e=>e.onclick=()=>{const s=S(l),i=+e.dataset.c;s.chk=s.chk.includes(i)?s.chk.filter(x=>x!==i):[...s.chk,i];if(s.chk.length>=3)marcaLido(l,"aplicar");salva();if(s.chk.length===c.chk.length)toast("Livro aplicado por completo! 🌱");render()})}
  if(sec==="quiz"){v.querySelectorAll(".op").forEach(b=>b.onclick=()=>{qResp=+b.dataset.o;if(qResp===c.quiz[qi].c)qAc++;render()});const p=$("#prox");if(p)p.onclick=()=>{qi++;qResp=null;render()};const r=$("#refazer");if(r)r.onclick=()=>{qi=0;qAc=0;qResp=null;render()}}
  if(sec==="notas"){$("#nota").oninput=e=>{S(l).nota=e.target.value;if(e.target.value.trim())marcaLido(l,"notas");salva()};
   $("#share").onclick=()=>{const L0=L.find(x=>x.id===l),t=`📚 *${L0.t}* (${L0.a})\n\n💡 ${c.frase}\n\n🌾 ${c.cards[0].h}: ${c.cards[0].ex}\n\n_Biblioteca do Crescimento_`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else location.href="https://wa.me/?text="+encodeURIComponent(t)}}
 }
 if(!livro&&aba==="inicio")mostraInst();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{aba=b.dataset.t;livro=null;render();scrollTo(0,0)});
let pedido=null;const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();pedido=e;mostraInst()});
function mostraInst(){const el=$("#inst");if(!el||standalone)return;el.hidden=false;$("#btnInst").onclick=async()=>{if(pedido){pedido.prompt();await pedido.userChoice;pedido=null;el.hidden=true}else alert("No Chrome, toque no menu ⋮ (canto de cima) e depois em \"Instalar app\" ou \"Adicionar à tela inicial\".")}}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
