<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Estudo Agro</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--verde:#1f5f3a;--verde2:#2f7a4d;--verdeclaro:#e3efe5;--amarelo:#f2b705;--amareloclaro:#fdf1c7;--marrom:#6b4426;--marromclaro:#efe3d6;--creme:#f7f3e8;--card:#fffdf7;--tx:#2a2218;--mut:#6a5f50;--linha:#dcd3c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--creme);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--verde);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.topo{display:flex;align-items:center;gap:10px}
.topo img{width:36px;height:36px;border-radius:9px}
.topo h1{margin:0;font-size:21px;flex:1}
.topo .sub{font-size:13px;opacity:.85;display:block;font-weight:400}
#filtros{margin-top:10px}
#filtros select{width:100%;font:600 17px system-ui;padding:11px 12px;border-radius:12px;border:0;background:#fff;color:var(--tx)}
.niveis{display:flex;gap:6px;margin-top:8px}
.niv{flex:1;border:0;border-radius:10px;padding:9px 2px;font:700 15px system-ui;background:rgba(255,255,255,.18);color:#fff}
.niv[aria-pressed=true]{background:var(--amarelo);color:#3a2a00}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
h2{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 12px;font:700 17px system-ui;background:var(--verde);color:#fff;min-height:50px}
.btn.am{background:var(--amarelo);color:#3a2a00}
.btn.mr{background:var(--marrom);color:#fff}
.btn.cl{background:var(--verdeclaro);color:var(--verde)}
.btn.lin{background:transparent;border:2px solid var(--linha);color:var(--tx)}
.btn.peq{padding:10px 8px;font-size:15px;min-height:44px}
.row{display:flex;gap:8px}.row>*{flex:1}
.tema{display:block}
.tema .cab{display:flex;gap:12px;align-items:center}
.tema .em{font-size:34px;width:48px;text-align:center}
.tema b{font-size:18px;display:block}
.tema small{color:var(--mut);font-size:15px}
.barra{height:8px;background:var(--marromclaro);border-radius:99px;overflow:hidden;margin:10px 0}
.barra i{display:block;height:100%;background:var(--verde2)}
.tag{display:inline-block;font:700 13px system-ui;padding:3px 10px;border-radius:99px;margin-right:6px}
.n1{background:var(--verdeclaro);color:var(--verde)}.n2{background:var(--amareloclaro);color:#7a5a00}.n3{background:var(--marromclaro);color:var(--marrom)}
.tg{background:#eee8d8;color:var(--mut)}
.face{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 16px;border-radius:18px;font-size:21px;font-weight:700;cursor:pointer;user-select:none;border:2px solid var(--linha);background:var(--card)}
.face.verso{background:var(--verdeclaro);border-color:var(--verde2);font-weight:500;font-size:19px}
.face small{display:block;margin-top:14px;font-weight:400;font-size:14px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--linha);background:var(--card);color:var(--tx);border-radius:12px;padding:13px 14px;margin-bottom:9px;font:600 17px/1.35 system-ui;min-height:52px}
.opt.ok{background:#d6ecd9;border-color:var(--verde2)}
.opt.no{background:#f6d9d2;border-color:#b3452f}
.expl{background:var(--amareloclaro);border-radius:12px;padding:12px;margin:10px 0;font-size:16px}
.big{font-size:44px;font-weight:800;text-align:center;color:var(--verde)}
details{background:var(--card);border:1px solid var(--linha);border-radius:14px;margin-bottom:10px}
summary{font-weight:700;padding:14px;font-size:18px;list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
summary::after{content:"＋";color:var(--marrom)}
details[open] summary::after{content:"－"}
details .corpo{padding:0 14px 12px}
details ul{margin:6px 0;padding-left:20px}details li{margin-bottom:8px}
.mut{color:var(--mut);font-size:15px}
input.num{width:100%;font:700 22px system-ui;padding:13px;border:2px solid var(--linha);border-radius:12px;margin:8px 0;background:#fff;color:var(--tx)}
a{color:var(--verde2)}
.fonte{font-size:15px;margin-bottom:8px;word-break:break-word}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--marrom);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;border:0;background:transparent;color:#efe3d6;padding:9px 0 8px;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button[aria-current=true]{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 3px 0 var(--amarelo)}
.inst{display:flex;gap:10px;align-items:center;border:2px dashed var(--amarelo);background:var(--amareloclaro)}
.inst span{flex:1;font-size:15px}.inst .btn{width:auto;padding:10px 14px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2218;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:40}
</style>
</head>

<script>
const TEMAS = [
  {id:"vin", nome:"Vinhaça localizada", emoji:"💧", resumo:"Composição, laudo, dose e calibração"},
  {id:"leg", nome:"Norma CETESB P4.231", emoji:"📜", resumo:"Dose máxima, restrições e monitoramento"},
  {id:"nut", nome:"Nutrição e correção", emoji:"🌱", resumo:"Corretivos, nutrientes e sintomas"},
  {id:"sol", nome:"Solo e preparo", emoji:"🟤", resumo:"Classes de solo, preparo e compactação"},
  {id:"can", nome:"Cana e o ciclo da usina", emoji:"🌾", resumo:"Do campo à usina e de volta"},
  {id:"log", nome:"Logística e eficiência", emoji:"🚛", resumo:"Ciclo, frota e capacidade operacional"}
];

const ESTUDO = {
vin: [
 {t:"O que é vinhaça", p:"Efluente líquido gerado na destilação do etanol. Não é um fertilizante de composição fixa: duas amostras de usinas ou períodos diferentes podem ter concentrações distintas.", l:[
  "Fatores que mudam a composição: matéria-prima e safra, processo industrial, diluição (água incorporada), armazenamento e amostragem.",
  "Materiais didáticos citam de 10 a 15 litros de vinhaça por litro de etanol (um estudo cita 11 a 13). É referência, não constante: use o dado medido da sua unidade.",
  "Pode conter potássio, outros nutrientes, sais e matéria orgânica, por isso o uso agrícola exige planejamento e autorização."]},
 {t:"Aplicação localizada", p:"Dirigir a vinhaça a uma faixa ou região do talhão, normalmente perto da linha da cana, em vez de espalhar sobre toda a superfície.", l:[
  "A largura da faixa e a distância da touceira dependem do sistema, do estágio da cultura e do projeto agronômico. «Localizada» não define uma medida universal.",
  "Formas de aplicação: área total, em faixa (localizada), incorporação ou injeção, e rede por tubulação/gotejamento.",
  "Benefícios são potenciais, não garantias. Localizada não elimina risco de lixiviação, escorrimento, salinização ou contaminação.",
  "Operador: confira talhão liberado, dose planejada, solo e previsão do tempo; durante a operação, observe alinhamento, vazamentos, entupimentos e escorrimento; registre tudo."]},
 {t:"Lendo o laudo e calculando", p:"Antes de converter concentração em dose por hectare, confirme unidade, data, representatividade da amostra e forma química.", l:[
  "kg/m³ equivale numericamente a g/L (1 m³ = 1.000 L). mg/L é mil vezes menor: erro de unidade multiplica ou divide a conta por mil.",
  "K e K₂O não são a mesma unidade: K₂O = K × 1,205. Confira se laudo e recomendação estão na mesma forma.",
  "Nutriente aplicado (kg/ha) = concentração (kg/m³) × volume (m³/ha). Ex. didático: 2 kg K₂O/m³ × 40 m³/ha = 80 kg K₂O/ha.",
  "Essa conta mostra o que foi distribuído, não quanto a cultura precisa: isso vem da análise de solo, da recomendação e das normas.",
  "pH sozinho não aprova nem reprova uma aplicação. CE indica sais dissolvidos; CE da vinhaça não equivale à CE do extrato do solo. DBO é indicador ambiental, não de dose."]},
 {t:"Calibração: vazão, velocidade e largura", p:"A dose por hectare depende da combinação vazão–velocidade–largura. Mudar uma sem rever as outras muda a dose.", l:[
  "Dose (m³/ha) = vazão (L/min) × 0,6 ÷ (velocidade km/h × largura m).",
  "Exemplo hipotético: 2.000 L/min, 4 km/h, 24 m → 2.000 × 0,6 ÷ (4 × 24) = 12,5 m³/ha.",
  "Aumentar a velocidade sem aumentar a vazão reduz a dose por hectare.",
  "Interrompa e comunique a supervisão em caso de risco ambiental, falha de equipamento ou condição fora do procedimento autorizado."]},
 {t:"O que a pesquisa mostrou (Embrapa, solo arenoso)", p:"Lance e colaboradores (Embrapa Meio Ambiente, Irriga, 2023) testaram vinhaça localizada e em área total em cana, em solo arenoso, Pirassununga (SP).", l:[
  "Dose: 3 mm (30 m³/ha), com 6 kg K/m³ (180 kg K/ha). Parcelas de 8 linhas, espaçamento de 1,5 m, 5 repetições.",
  "CE na camada 0–20 cm: testemunha 0,10 dS/m; vinhaça em área total 0,37; vinhaça localizada 1,43 (1 dia) e 1,20 (30 dias).",
  "Perfilhos: testemunha 139,8; localizada 115,5 (cerca de 17% menos). Massa verde: 4,25 g contra 3,20 g (cerca de 25% menos).",
  "Água localizada ficou igual à testemunha: o efeito vem do sal e do K da vinhaça, não da água.",
  "Não houve diferença entre tratamentos a 75–85 cm de profundidade, em período de pouca chuva.",
  "Limites: um talhão, uma safra, cerca de 4 meses, solo arenoso e cana em brotação. Não estenda direto a outros solos e fases. Os autores recomendam cautela e mais estudos em solos arenosos e regiões chuvosas."]}
],
leg: [
 {t:"A norma em uma frase", p:"A CETESB P4.231 (3ª edição, 2ª versão, fev/2015) define critérios e procedimentos para aplicar vinhaça no solo agrícola em São Paulo.", l:[
  "Relacionadas: DD 132/2018 (plano de monitoramento das águas subterrâneas da vinhaça) e DD 023/2020 (PAV simplificado, vinhaça concentrada/enriquecida e aplicação dirigida).",
  "Os valores deste app seguem o texto da P4.231 consultado. Normas mudam: confirme a versão vigente na CETESB antes de decidir."]},
 {t:"Dose máxima e limite de potássio", p:"O solo pode receber potássio até 5% da CTC. Ao atingir esse limite, a aplicação fica restrita à reposição de 185 kg de K₂O/ha por corte.", l:[
  "m³ de vinhaça/ha = [(0,05 × CTC − ks) × 3744 + 185] ÷ kvi",
  "CTC: capacidade de troca de cátions do solo (cmolc/dm³). ks: potássio no solo (cmolc/dm³), de 0 a 0,80 m. kvi: K₂O na vinhaça (kg/m³), média das análises.",
  "3744 converte para kg de K por hectare em 0,80 m de profundidade; 185 é o K₂O extraído pela cultura por corte.",
  "Exemplo hipotético: CTC 6, ks 0,20, kvi 2 → [(0,30 − 0,20) × 3744 + 185] ÷ 2 ≈ 280 m³/ha."]},
 {t:"Onde pode e onde não pode", p:"Restrições do texto da norma:", l:[
  "APP: proibido aplicar. Distância mínima de 6 m da APP, com sistema de segurança.",
  "Poços: proibido em área de proteção de poços e a menos de 100 m de poços de abastecimento.",
  "Núcleos urbanos: no mínimo 1.000 m do perímetro (a CETESB pode ampliar).",
  "Lençol freático: pelo menos 1,50 m de profundidade do aquífero livre na hora de aplicar.",
  "Declividade acima de 15%: exige medidas contra erosão.",
  "Faixas de domínio de ferrovias e rodovias federais e estaduais ficam de fora.",
  "Tanques impermeabilizados com geomembrana (ou técnica equivalente) e canais mestres impermeabilizados."]},
 {t:"Monitoramento e documentos", p:"A conformidade depende de coleta, laudos e do PAV.", l:[
  "Águas subterrâneas: mínimo de 4 poços (1 a montante e 3 a jusante dos tanques; drenos testemunha dispensam). Coleta anual entre setembro e novembro, em laboratório acreditado ISO/IEC 17025.",
  "Solo: fertilidade anual, antes da safra, de 0 a 0,80 m; qualidade a cada 5 anos, de 0 a 0,20 m.",
  "Vinhaça: K₂O determinado semanalmente; caracterização com no mínimo duas amostragens na safra anterior.",
  "PAV (Plano de Aplicação de Vinhaça): anual, entregue à CETESB até 2 de abril, assinado por profissional habilitado pelo CREA com ART específica.",
  "Planta na escala 1:20.000 ou melhor, datum SIRGAS 2000, com taxas de dosagem em cores a cada 150 m³/ha."]}
],
nut: [
 {t:"A ordem do manejo", p:"Amostrar, corrigir, adubar e monitorar, nessa ordem.", l:[
  "Amostrar: análise de solo a 0–20 e 20–40 cm antes do plantio e a cada ciclo.",
  "Corrigir: calcário (e gesso, se o subsolo pedir) 60 a 90 dias antes de plantar, antes da aração e gradagem.",
  "Adubar: P no sulco, N e K conforme o ciclo, S e micros quando faltarem.",
  "Monitorar: análise foliar (folha +3) e observação de sintomas; ajustar na soqueira.",
  "Excesso e falta prejudicam igualmente: o equilíbrio é que dá produtividade."]},
 {t:"Corretivos e condicionadores", p:"Preparam o ambiente da raiz e vêm primeiro.", l:[
  "Calcário: neutraliza acidez, eleva pH, elimina Al tóxico, dá Ca e Mg. Meta comum de V% de 60 a 70% e Mg mínimo em torno de 8 mmolc/dm³ (referência do guia; defina pela análise).",
  "Gesso: não corrige pH. Leva Ca e S ao subsolo (20–40 cm) e reduz Al em profundidade. Indicado com Ca baixo e/ou m% acima de 20–30% no subsolo.",
  "Fosfatagem corretiva: quando P resina está muito baixo (referência: abaixo de ~15 mg/dm³).",
  "Silicatos: corrigem acidez e dão Si; úteis em solos arenosos e muito intemperizados.",
  "Matéria orgânica: vinhaça (K e água), torta de filtro (P, Ca, N e M.O.) e palha. Excesso de vinhaça causa excesso de K, lixiviação e salinização."]},
 {t:"Macronutrientes: função e sintomas", p:"Extração por tonelada de colmos citada no guia do projeto (orientativa).", l:[
  "N (~1 a 1,5 kg/t): clorofila e crescimento. Amarelecimento uniforme nas folhas velhas, colmos finos. Excesso atrasa a maturação.",
  "P (~0,3 a 0,6 kg P₂O₅/t): energia e raízes. Plantas pequenas, folhas velhas verde-escuras ou arroxeadas. Pouco móvel no solo: aplicar no sulco.",
  "K (~1,5 a 2 kg K₂O/t, o mais extraído): água e açúcar no colmo. Bordas e pontas das folhas velhas alaranjadas e secas.",
  "Ca: parede celular e ponta da raiz. Folhas novas deformadas, raízes curtas. Calcário e gesso.",
  "Mg: centro da clorofila. Faixas amarelas entre nervuras nas folhas velhas, pintas marrom-avermelhadas.",
  "S: proteínas. Amarelo geral, mais forte nas folhas novas (confunde com falta de N). Ureia e MAP não trazem S."]},
 {t:"Micronutrientes e chave de sintomas", p:"Onde o sintoma aparece indica a mobilidade do nutriente na planta.", l:[
  "Folhas velhas (móveis): N, P, K, Mg.",
  "Folhas novas (pouco móveis): S, Ca, B, Cu, Mn, Fe, Zn.",
  "Zn: faixas amarelo-esbranquiçadas ao lado da nervura central, colmos curtos. Falta em arenoso ou com excesso de P/calcário.",
  "B: folhas novas enrugadas, «janelas» translúcidas; faixa estreita entre falta e toxidez.",
  "Mn e Fe: listras amarelas entre nervuras das folhas novas (parecidas); aparecem com excesso de calagem.",
  "Fe, Mo e Cl: situacionais. O KCl já fornece cloro."]},
 {t:"Extração, exportação e cuidados", p:"Os números variam com ambiente, variedade e produtividade.", l:[
  "Estudo com cana irrigada (soca, RB92579, Juazeiro-BA; Salviano et al., 2017): máxima absorção entre 220 e 352 dias após o corte; ordem de acúmulo K > N > Ca > S > P > Mg; a colheita exportou cerca de 60 a 90% do acumulado.",
  "Ao comparar fontes, confira se o valor é de K ou K₂O, P ou P₂O₅.",
  "Ureia sobre a palha perde N por volatilização: aplique com umidade, incorpore ou use fonte estabilizada.",
  "Adubo no sulco sem contato direto com a gema: o sal queima a brotação, mais em solo arenoso.",
  "Argila fixa mais P (dose maior no sulco). Em arenoso, parcele N e K em 2 a 3 vezes.",
  "Excesso de P e de calcário pode induzir deficiência de micronutrientes.",
  "O Boletim 100 do IAC (3ª edição, 2022) é a referência paulista de recomendação de adubação e calagem."]}
],
sol: [
 {t:"Principais solos e aptidão para cana", p:"Conhecer o solo de cada talhão é o primeiro passo para definir preparo, adubação e defensivos.", l:[
  "Latossolo (argiloso): profundo, bem drenado, ácido, baixa fertilidade natural. Responde muito à correção. Risco: compactação a 20–40 cm.",
  "Nitossolo (terra roxa): aptidão excelente, retém água e nutrientes. Fixa muito P; em relevo ondulado há erosão.",
  "Argissolo: camada arenosa sobre horizonte argiloso. Aptidão média. Risco-chave: erosão, a água escorre sobre o horizonte argiloso.",
  "Neossolo Quartzarênico: mais de 85% de areia. Lixiviação de N, K e B, seca, carência de micros e S. Aptidão restrita.",
  "Cambissolo e Neossolo Litólico: rasos e pedregosos; estresse hídrico e erosão. Não subsolar fundo.",
  "Gleissolo e Organossolo: lençol alto e pouco oxigênio. Drenar antes, plantar em camalhão, tráfego só com solo firme."]},
 {t:"Teste do tato e ambiente de produção", p:"Umedeça um punhado de terra e amasse entre os dedos.", l:[
  "Arenoso: não forma bola, esfarela, áspero.",
  "Médio: forma bola firme; a fita quebra cedo (até ~2,5 cm).",
  "Argiloso: forma fita longa (mais de 5 cm), pegajoso e plástico.",
  "Ambiente favorável: solos profundos, argilosos ou médios, boa água e fertilidade. Intermediário: textura média ou leve restrição. Restritivo: arenoso, raso ou mal drenado, exige variedade rústica, parcelamento e muita cobertura."]},
 {t:"Preparo e plantio, passo a passo", p:"Checklist resumido do guia do projeto.", l:[
  "Reforma: eliminar a soqueira velha; se possível, rotação com leguminosas (amendoim, soja, crotalária).",
  "Corrigir antes de preparar: calcário e gesso 60 a 90 dias antes do plantio.",
  "Subsolagem (35–40 cm) só onde há compactação e com solo seco e friável; com solo úmido ela alisa e piora.",
  "Sulco uniforme, em geral 25–30 cm de fundo, alinhado às curvas de nível.",
  "Adubo no sulco sem tocar a gema. Distribua de 12 a 18 gemas por metro e cubra com 5 a 10 cm de terra.",
  "Conferir o stand em 30 a 45 dias e replantar as falhas."]},
 {t:"Compactação e tráfego controlado", p:"Evidências da Circular Técnica 28 da Embrapa Cerrados (Sá et al., 2015), em soqueiras de cana.", l:[
  "O conjunto trator-transbordo é apontado como o principal responsável pela compactação.",
  "Com espaçamento de 1,5 m, bitola de 2,0 m pisoteava cerca de 73% da área; com bitola de 3,0 m, cerca de 46%. Recomenda-se bitolas em múltiplos do espaçamento.",
  "Quanto maior a umidade do solo, maior a compactação: evite tráfego com solo úmido.",
  "Escarificação anual da entrelinha (25–30 cm), em quatro socas, não diferiu em produtividade: 354,8 contra 348,4 t/ha de colmos (diferença não significativa). A recomendação foi evitar escarificar e prevenir a compactação.",

 {n:"CETESB, DD 132/2018 (monitoramento das águas subterrâneas, vinhaça)", u:"https://cetesb.sp.gov.br/wp-content/uploads/2018/07/Decisão-de-Diretoria-132-2018-E-C-Plano-de-Monitoramento-das-Águas-Subterraneas-Vinhaça.pdf"},

 {n:"Mistura de etanol a 32% (Reuters via Notícias Agrícolas)", u:"https://www.noticiasagricolas.com.br/noticias/biocombustivel/425754-brasil-eleva-mistura-de-etanol-na-gasolina-para-32-a-partir-de-sabado.amp.html"}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="estudoAgroV1";
let DB={conhecidos:{},hist:[],tema:"todos",nivel:0};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==="object")DB=Object.assign(DB,o)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
CARTOES.forEach(c=>c.id=c.t+hash(c.f));
const NIVNOME=["Todos","Leve","Moderado","Avançado"];
const TNOME=Object.fromEntries(TEMAS.map(t=>[t.id,t.nome]));
const filt=a=>a.filter(x=>(DB.tema==="todos"||x.t===DB.tema)&&(!DB.nivel||x.n===DB.nivel));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}

let tab="home";
const TABS=[["home","🏠","Início"],["cartoes","🃏","Cartões"],["quiz","❓","Quiz"],["estudo","📖","Estudo"],["calculo","🧮","Cálculo"]];
function irPara(t){tab=t;render();window.scrollTo(0,0)}
function navDraw(){$("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" ${tab===t[0]?'aria-current="true"':''}><span>${t[1]}</span>${t[2]}</button>`).join("")}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)irPara(b.dataset.t)};

function filtrosDraw(){
 const mostra=(tab==="cartoes"||tab==="quiz"||tab==="estudo");
 $("#filtros").hidden=!mostra;
 if(!mostra)return;
 $("#selTema").innerHTML=`<option value="todos">Todos os temas</option>`+TEMAS.map(t=>`<option value="${t.id}" ${DB.tema===t.id?"selected":""}>${t.emoji} ${esc(t.nome)}</option>`).join("");
 $("#selTema").value=DB.tema;
 $("#niveis").hidden=(tab==="estudo");
 $("#niveis").innerHTML=NIVNOME.map((n,i)=>`<button class="niv" data-n="${i}" aria-pressed="${DB.nivel===i}">${n}</button>`).join("");
}
$("#selTema").onchange=e=>{DB.tema=e.target.value;save();quizReset();cardAtual=null;render()};
$("#niveis").onclick=e=>{const b=e.target.closest(".niv");if(!b)return;DB.nivel=+b.dataset.n;save();quizReset();cardAtual=null;render()};

/* ---------- INÍCIO ---------- */
let instPrompt=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();instPrompt=e;if(tab==="home")render()});
addEventListener("appinstalled",()=>{instPrompt=null;if(tab==="home")render()});
function progTema(id){const c=CARTOES.filter(x=>x.t===id);const k=c.filter(x=>DB.conhecidos[x.id]).length;return {k,t:c.length}}
function viewHome(){
 const totC=CARTOES.length,totK=CARTOES.filter(c=>DB.conhecidos[c.id]).length;
 const ult=DB.hist.slice(-5);
 const media=ult.length?Math.round(ult.reduce((a,h)=>a+h.p*100/h.t,0)/ult.length):null;
 let h="";
 if(!standalone())h+=`<div class="card inst"><span>Instale no celular para estudar sem internet.</span><button class="btn am peq" id="bInst">📲 Instalar app</button></div>`;
 h+=`<button class="btn am" id="bSorteio" style="margin-bottom:12px">🎲 Sortear um cartão agora</button>`;
 h+=`<div class="card"><b>Seu progresso</b><div class="barra"><i style="width:${Math.round(totK*100/totC)}%"></i></div><span class="mut">${totK} de ${totC} cartões dominados · ${DB.hist.length} quiz feitos${media!==null?` · média dos últimos ${ult.length}: ${media}%`:""}</span></div>`;
 h+=`<h2>Temas de estudo</h2>`;
 TEMAS.forEach(t=>{const p=progTema(t.id);
  h+=`<div class="card tema"><div class="cab"><div class="em">${t.emoji}</div><div><b>${esc(t.nome)}</b><small>${esc(t.resumo)}</small></div></div>
  <div class="barra"><i style="width:${Math.round(p.k*100/p.t)}%"></i></div><div class="mut" style="margin-bottom:8px">${p.k} de ${p.t} cartões dominados</div>
  <div class="row"><button class="btn cl peq" data-go="estudo" data-id="${t.id}">📖 Estudar</button><button class="btn cl peq" data-go="cartoes" data-id="${t.id}">🃏 Cartões</button><button class="btn cl peq" data-go="quiz" data-id="${t.id}">❓ Quiz</button></div></div>`});
 h+=`<h2>Fontes</h2><details><summary>Onde estão os dados</summary><div class="corpo">`+FONTES.map(f=>`<div class="fonte"><a href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.n)}</a></div>`).join("")+`<div class="fonte">Guias e apostilas do projeto Eu Agrônomo (solos, nutrição e correção, vinhaça localizada).</div></div></details>`;
 h+=`<p class="mut">Material de estudo. Doses, vinhaça e defensivos dependem de análise, responsável técnico habilitado e normas vigentes. Exemplos numéricos são hipotéticos.</p>`;
 return h;
}
function bindHome(){
 const bi=$("#bInst");if(bi)bi.onclick=async()=>{if(instPrompt){instPrompt.prompt();try{await instPrompt.userChoice}catch(e){}instPrompt=null;render()}else alert('No Chrome, toque no menu ⋮ e depois em "Instalar app".')};
 $("#bSorteio").onclick=()=>{DB.tema="todos";DB.nivel=0;save();cardAtual=null;irPara("cartoes")};
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{DB.tema=b.dataset.id;DB.nivel=0;save();quizReset();cardAtual=null;irPara(b.dataset.go)});
}

/* ---------- CARTÕES ---------- */
let cardAtual=null,virado=false;
function sortear(){
 const d=filt(CARTOES);if(!d.length)return null;
 const novos=d.filter(c=>!DB.conhecidos[c.id]);
 let pool=(novos.length&&Math.random()<0.8)?novos:d;
 if(pool.length>1&&cardAtual)pool=pool.filter(c=>c.id!==cardAtual.id);
 return rnd(pool);
}
function viewCartoes(){
 const d=filt(CARTOES);
 if(!d.length)return `<div class="card">Nenhum cartão neste filtro.</div>`;
 if(!cardAtual||!d.includes(cardAtual)){cardAtual=sortear();virado=false}
 const c=cardAtual,k=d.filter(x=>DB.conhecidos[x.id]).length;
 let h=`<div class="mut" style="margin-bottom:8px">${k} de ${d.length} dominados neste filtro</div>`;
 h+=`<div style="margin-bottom:8px"><span class="tag n${c.n}">${NIVNOME[c.n]}</span><span class="tag tg">${esc(TNOME[c.t])}</span></div>`;
 h+=`<div class="face ${virado?"verso":""}" id="face">${esc(virado?c.v:c.f)}<small>${virado?"":"Toque para ver a resposta"}</small></div>`;
 if(virado){
  h+=`<div class="row" style="margin-top:12px"><button class="btn mr" id="bRev">Revisar depois</button><button class="btn" id="bSei">Eu sabia</button></div>`;
 }
 h+=`<button class="btn lin" id="bPula" style="margin-top:10px">Sortear outro</button>`;
 h+=`<button class="btn lin peq" id="bZera" style="margin-top:10px">Zerar progresso deste filtro</button>`;
 return h;
}
function bindCartoes(){
 const f=$("#face");if(f)f.onclick=()=>{virado=!virado;render()};
 const prox=()=>{cardAtual=sortear();virado=false;render();window.scrollTo(0,0)};
 const s=$("#bSei");if(s)s.onclick=()=>{DB.conhecidos[cardAtual.id]=1;save();prox()};
 const r=$("#bRev");if(r)r.onclick=()=>{delete DB.conhecidos[cardAtual.id];save();prox()};
 const p=$("#bPula");if(p)p.onclick=prox;
 const z=$("#bZera");if(z)z.onclick=()=>{if(confirm("Zerar o progresso dos cartões deste filtro?")){filt(CARTOES).forEach(c=>delete DB.conhecidos[c.id]);save();render()}};
}

/* ---------- QUIZ ---------- */
let Q=null;
function quizReset(){Q=null}
function viewQuiz(){
 const d=filt(PERGUNTAS);
 if(!d.length)return `<div class="card">Nenhuma pergunta neste filtro.</div>`;
 if(!Q){
  const n=Math.min(10,d.length);
  let h=`<div class="card"><b>Quiz</b><p>${d.length} perguntas neste filtro. Cada rodada sorteia ${n}.</p><button class="btn am" id="bIni">Começar (${n} perguntas)</button></div>`;
  const ult=DB.hist.slice(-5).reverse();
  if(ult.length){h+=`<h2>Últimas rodadas</h2>`+ult.map(x=>`<div class="card" style="padding:10px 14px"><b>${x.p}/${x.t}</b> · ${esc(x.tema)} · ${esc(x.nivel)}<div class="mut">${esc(x.d)}</div></div>`).join("")}
  return h;
 }
 if(Q.fim){
  const pct=Math.round(Q.acertos*100/Q.lista.length);
  let h=`<div class="card"><div class="big">${Q.acertos}/${Q.lista.length}</div><p style="text-align:center;margin:0">${pct>=80?"Muito bem!":pct>=50?"Bom caminho. Revise os erros abaixo.":"Vale reler o tema e tentar de novo."}</p></div>`;
  if(Q.erros.length){h+=`<h2>Para revisar</h2>`+Q.erros.map(p=>`<div class="card"><b>${esc(p.q)}</b><div class="expl"><b>Resposta:</b> ${esc(p.o[p.c])}<br>${esc(p.e)}</div></div>`).join("")}
  h+=`<button class="btn am" id="bNova">Nova rodada</button>`;
  return h;
 }
 const p=Q.lista[Q.i];
 let h=`<div class="barra"><i style="width:${Math.round(Q.i*100/Q.lista.length)}%"></i></div><div class="mut" style="margin-bottom:8px">Pergunta ${Q.i+1} de ${Q.lista.length} · <span class="tag n${p.n}">${NIVNOME[p.n]}</span></div>`;
 h+=`<div class="card"><b style="font-size:19px">${esc(p.q)}</b></div>`;
 p.ord.forEach((oi,k)=>{
  let cl="";if(Q.resp!==null){if(oi===p.c)cl="ok";else if(k===Q.resp)cl="no"}
  h+=`<button class="opt ${cl}" data-k="${k}" ${Q.resp!==null?"disabled":""}>${esc(p.o[oi])}</button>`});
 if(Q.resp!==null){h+=`<div class="expl">${esc(p.e)}</div><button class="btn" id="bProx">${Q.i+1<Q.lista.length?"Próxima":"Ver resultado"}</button>`}
 return h;
}
function bindQuiz(){
 const ini=()=>{const d=filt(PERGUNTAS);Q={lista:shuffle(d).slice(0,10).map(p=>Object.assign({},p,{ord:shuffle([0,1,2,3])})),i:0,resp:null,acertos:0,erros:[],fim:false};render();window.scrollTo(0,0)};
 const a=$("#bIni");if(a)a.onclick=ini;
 const b=$("#bNova");if(b)b.onclick=()=>{Q=null;ini()};
 document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
  if(Q.resp!==null)return;const k=+o.dataset.k,p=Q.lista[Q.i];Q.resp=k;
  if(p.ord[k]===p.c)Q.acertos++;else Q.erros.push(p);
  render();
 });
 const n=$("#bProx");if(n)n.onclick=()=>{
  if(Q.i+1<Q.lista.length){Q.i++;Q.resp=null}
  else{Q.fim=true;DB.hist.push({p:Q.acertos,t:Q.lista.length,tema:DB.tema==="todos"?"Todos os temas":TNOME[DB.tema],nivel:NIVNOME[DB.nivel],d:new Date().toLocaleDateString("pt-BR")});DB.hist=DB.hist.slice(-50);save()}
  render();window.scrollTo(0,0);
 };
}

/* ---------- ESTUDO ---------- */
function viewEstudo(){
 if(DB.tema==="todos")return `<h2>Escolha um tema</h2>`+TEMAS.map(t=>`<button class="card tema" style="width:100%;text-align:left;font:inherit;color:inherit" data-t="${t.id}"><div class="cab"><div class="em">${t.emoji}</div><div><b>${esc(t.nome)}</b><small>${esc(t.resumo)}</small></div></div></button>`).join("");
 const t=TEMAS.find(x=>x.id===DB.tema),s=ESTUDO[DB.tema]||[];
 let h=`<h2>${t.emoji} ${esc(t.nome)}</h2>`;
 s.forEach((sec,i)=>{
  h+=`<details ${i===0?"open":""}><summary>${esc(sec.t)}</summary><div class="corpo">${sec.p?`<p>${esc(sec.p)}</p>`:""}<ul>${sec.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>`});
 h+=`<div class="row" style="margin-top:12px"><button class="btn am" data-go="cartoes">🃏 Cartões do tema</button><button class="btn" data-go="quiz">❓ Quiz do tema</button></div>`;
 return h;
}
function bindEstudo(){
 document.querySelectorAll("[data-t]").forEach(b=>{if(b.tagName==="BUTTON"&&b.classList.contains("card"))b.onclick=()=>{DB.tema=b.dataset.t;save();render()}});
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{quizReset();cardAtual=null;irPara(b.dataset.go)});
}

/* ---------- CÁLCULO ---------- */
const GER=[
 {id:"k2o",nome:"K₂O aplicado (kg/ha)",gen(){const c=rnd([1.5,1.8,2,2.2,2.5,3]),v=rnd([20,25,30,35,40,45,50,60]);return {txt:`O laudo da vinhaça informa ${fm(c)} kg de K₂O/m³. Foram aplicados ${v} m³/ha. Quantos kg de K₂O por hectare?`,r:c*v,un:"kg K₂O/ha",sol:`concentração × volume = ${fm(c)} × ${v} = ${fm(c*v)} kg K₂O/ha`}}},
 {id:"dose",nome:"Dose por vazão (m³/ha)",gen(){const Q=rnd([1500,1800,2000,2400,2800]),v=rnd([3,4,5,6]),w=rnd([18,20,24,30]);const r=Q*0.6/(v*w);return {txt:`Aplicador com vazão de ${Q} L/min, velocidade de ${v} km/h e largura de trabalho de ${w} m. Qual a dose em m³/ha?`,r,un:"m³/ha",sol:`dose = vazão × 0,6 ÷ (velocidade × largura) = ${Q} × 0,6 ÷ (${v} × ${w}) = ${fm(r)} m³/ha`}}},
 {id:"cam",nome:"Número de caminhões",gen(){const Tc=rnd([60,72,80,90,100,120]),it=rnd([8,10,12,15]);const e=Tc/it;return {txt:`O ciclo do caminhão (Tc) é de ${Tc} min e a frente precisa de um caminhão chegando a cada ${it} min. Quantos caminhões (arredonde para cima)?`,r:Math.ceil(e),un:"caminhões",exato:true,sol:`N = Tc ÷ intervalo = ${Tc} ÷ ${it} = ${fm(e)} → ${Math.ceil(e)} caminhões`}}},
 {id:"cetesb",nome:"Dose máxima CETESB (m³/ha)",gen(){const ctc=rnd([4,5,6,7,8]),f=rnd([0.3,0.5,0.7]),ks=Math.round(ctc*0.05*f*100)/100,kvi=rnd([1.5,2,2.5,3]);const r=((0.05*ctc-ks)*3744+185)/kvi;return {txt:`Pela fórmula da P4.231 (exemplo hipotético): CTC = ${ctc} cmolc/dm³, ks = ${fm(ks)} cmolc/dm³ e kvi = ${fm(kvi)} kg K₂O/m³. Qual a dose máxima em m³/ha?`,r,un:"m³/ha",sol:`[(0,05 × ${ctc} − ${fm(ks)}) × 3744 + 185] ÷ ${fm(kvi)} = [${fm(0.05*ctc-ks)} × 3744 + 185] ÷ ${fm(kvi)} = ${fm(r)} m³/ha`}}},
 {id:"cap",nome:"Capacidade de campo (ha/h)",gen(){const v=rnd([4,5,6,7]),w=rnd([12,18,24,30]),ef=rnd([60,65,70,75,80]);const r=v*w/10*ef/100;return {txt:`Conjunto com velocidade de ${v} km/h, largura de ${w} m e eficiência de campo de ${ef}%. Qual a capacidade em ha/h?`,r,un:"ha/h",sol:`${v} × ${w} ÷ 10 × ${ef/100} = ${fm(r)} ha/h`}}},
 {id:"kk",nome:"Converter K em K₂O",gen(){const k=rnd([50,80,100,120,150]);const r=k*1.205;return {txt:`Um laudo traz ${k} kg de K. Quantos kg de K₂O isso equivale? (K₂O = K × 1,205)`,r,un:"kg K₂O",sol:`${k} × 1,205 = ${fm(r)} kg K₂O`}}}
];
function fm(x){return (Math.round(x*100)/100).toString().replace(".",",")}
let ger=GER[0],prob=null,resultado=null;
function novoProb(){prob=ger.gen();resultado=null}
function viewCalculo(){
 if(!prob)novoProb();
 let h=`<h2>Treino de cálculo</h2><div class="mut" style="margin-bottom:8px">Números sorteados e hipotéticos: servem para treinar o raciocínio, não são recomendação de dose.</div>`;
 h+=`<select id="selGer" style="width:100%;font:600 17px system-ui;padding:12px;border-radius:12px;border:2px solid var(--linha);background:#fff;margin-bottom:10px">${GER.map(g=>`<option value="${g.id}" ${g.id===ger.id?"selected":""}>${esc(g.nome)}</option>`).join("")}</select>`;
 h+=`<div class="card"><b style="font-size:18px">${esc(prob.txt)}</b>`;
 if(!resultado){h+=`<input class="num" id="resp" inputmode="decimal" placeholder="Sua resposta (${esc(prob.un)})" autocomplete="off"><button class="btn" id="bConf">Conferir</button>`}
 else{h+=`<div class="expl" style="background:${resultado.ok?"#d6ecd9":"#f6d9d2"}"><b>${resultado.ok?"Certo!":"Ainda não."}</b> Resposta: ${fm(prob.r)} ${esc(prob.un)}<br>${esc(prob.sol)}</div>`}
 h+=`</div><button class="btn ${resultado?"am":"lin"}" id="bNovo">Novo exercício</button>`;
 return h;
}
function bindCalculo(){
 $("#selGer").onchange=e=>{ger=GER.find(g=>g.id===e.target.value);novoProb();render()};
 $("#bNovo").onclick=()=>{novoProb();render()};
 const b=$("#bConf");if(b)b.onclick=()=>{
  const v=parseFloat(($("#resp").value||"").replace(",","."));
  if(isNaN(v)){toast("Digite um número");return}
  const ok=prob.exato?v===prob.r:Math.abs(v-prob.r)<=Math.max(0.02*Math.abs(prob.r),0.05);
  resultado={ok};render();
 };
}

/* ---------- RENDER ---------- */
function render(){
 navDraw();filtrosDraw();
 const v=$("#view");
 if(tab==="home"){v.innerHTML=viewHome();bindHome()}
 else if(tab==="cartoes"){v.innerHTML=viewCartoes();bindCartoes()}
 else if(tab==="quiz"){v.innerHTML=viewQuiz();bindQuiz()}
 else if(tab==="estudo"){v.innerHTML=viewEstudo();bindEstudo()}
 else{v.innerHTML=viewCalculo();bindCalculo()}
}
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
