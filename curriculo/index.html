/* ================= MINI GERADOR DE PDF (Helvetica, A4) ================= */
const WIN={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,

function winCode(ch){ const c=ch.codePointAt(0); if(c>=32&&c<127) return c; if(c>=160&&c<=255) return c; if(WIN[c]) return WIN[c]; if(c===9) return 32; return null; }
function cleanPdfText(s){ return Array.from(String(s||'')).map(ch=>winCode(ch)===null?(/\s/.test(ch)?' ':''):ch).join(''); }
class MiniPDF{
  constructor(){ this.W=595.28; this.H=841.89; this.pages=[]; this.cur=null; this.font='F1'; this.size=10; this.addPage(); }
  addPage(){ this.cur=[]; this.pages.push(this.cur); return this; }
  rgb(hex){ hex=hex.replace('#',''); return [0,2,4].map(i=>(parseInt(hex.substr(i,2),16)/255).toFixed(3)).join(' '); }
  setFont(bold,size){ this.font=bold?'F2':'F1'; this.size=size; }
  width(s,size,bold){ const t=bold?HBW:HW; let w=0; for(const ch of cleanPdfText(s)){ const c=winCode(ch); w+=(c&&c>=32?t[c-32]:500)||0; } return w*(size||this.size)/1000; }
  enc(s){ let o=''; for(const ch of cleanPdfText(s)){ const c=winCode(ch); if(c===40||c===41||c===92) o+='\\'+String.fromCharCode(c); else o+=String.fromCharCode(c); } return o; }
  text(s,x,y,color){ this.cur.push(`BT /${this.font} ${this.size} Tf ${this.rgb(color||'#222222')} rg ${x.toFixed(2)} ${(this.H-y).toFixed(2)} Td (${this.enc(s)}) Tj ET`); }
  textRight(s,xr,y,color){ this.text(s,xr-this.width(s,this.size,this.font==='F2'),y,color); }
  rect(x,y,w,h,color){ this.cur.push(`${this.rgb(color)} rg ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); }
  line(x1,y1,x2,y2,color,lw){ this.cur.push(`${this.rgb(color)} RG ${(lw||0.6)} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
  wrap(s,maxW,size,bold){
    const out=[]; String(s||'').split('\n').forEach(par=>{
      const words=par.split(/\s+/).filter(Boolean); let line='';
      words.forEach(w=>{ const t=line?line+' '+w:w;
        if(this.width(t,size,bold)<=maxW){ line=t; return; }
        if(line) out.push(line);
        if(this.width(w,size,bold)>maxW){ let part=''; for(const ch of w){ if(this.width(part+ch,size,bold)>maxW){ out.push(part); part=ch; } else part+=ch; } line=part; }
        else line=w; });
      if(line) out.push(line); });
    return out;
  }
  output(title){
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const cat=add(''), pages=add('');
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const kids=[];
    this.pages.forEach(p=>{ const content=p.join('\n'); const c=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent ${pages} 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${c} 0 R >>`)); });
    objs[cat-1]=`<< /Type /Catalog /Pages ${pages} 0 R >>`;
    objs[pages-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
    const info=add(`<< /Title (${this.enc(title||'Curriculo')}) /Producer (Curriculo em 5 Minutos) >>`);
    let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(pdf.length); pdf+=`${i+1} 0 obj\n${o}\nendobj\n`; });
    const xref=pdf.length;
    pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    pdf+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const b=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++) b[i]=pdf.charCodeAt(i)&255; return b;
  }
}

function fmtMonth(m){ if(!m) return ''; const [y,mm]=m.split('-'); return MONTHS[(+mm||1)-1]+'/'+y; }
function period(x){ const a=fmtMonth(x.start), b=x.current?'atual':fmtMonth(x.end); return a&&b?a+' – '+b:(a||b); }
function monthsOf(x){ if(!x.start) return 0; const [y1,m1]=x.start.split('-').map(Number); let y2,m2;
  if(x.current||!x.end){ const d=new Date(); y2=d.getFullYear(); m2=d.getMonth()+1; } else [y2,m2]=x.end.split('-').map(Number);
  return Math.max(0,(y2-y1)*12+(m2-m1)+1); }
function expYears(){ const m=cv().exp.reduce((s,x)=>s+monthsOf(x),0); return m; }
function yearsTxt(m){ if(m<12) return m<=1?'1 mês':m+' meses'; const y=Math.round(m/12); return y+(y>1?' anos':' ano'); }
function joinE(a){ a=a.filter(Boolean); return a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]; }
function lc(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
function eduPhrase(){ const e=cv().edu; if(!e.length) return ''; const ord=x=>LEVELS.indexOf(x.level); const top=e.slice().sort((a,b)=>ord(b)-ord(a))[0];
  const st2=top.status==='Concluído'?(top.level.startsWith('Ensino')?' completo':' concluído'):top.status==='Cursando'?' em andamento':' incompleto';
  return (top.course&&!top.level.startsWith('Ensino')?top.level.replace('Curso ','')+' em '+top.course:top.level+(top.course?' ('+top.course+')':''))+st2; }
function eduSentence(){ const e=cv().edu; if(!e.length) return ''; const top=e.slice().sort((a,b)=>LEVELS.indexOf(b.level)-LEVELS.indexOf(a.level))[0];
  const base={'Ensino Fundamental':'o ensino fundamental','Ensino Médio':'o ensino médio','Curso Técnico':top.course?'o curso técnico em '+top.course:'um curso técnico',
    'Ensino Superior':top.course?'a graduação em '+top.course:'o ensino superior','Pós-graduação':top.course?'a pós-graduação em '+top.course:'uma pós-graduação'}[top.level]||'';
  if(!base) return ''; return top.status==='Concluído'?`Concluí ${base}.`:top.status==='Cursando'?`Estou cursando ${base}.`:`Cursei parte d${base.startsWith('a ')?'a':'o'} ${base.replace(/^(o|a|um|uma) /,'')}.`; }
function autoSummary(){
  const c=cv(), a=A(), role=c.role||'profissional', sk=c.skills.slice(0,2).map(lc);
  if(c.area==='primeiro'||(!c.exp.length)){
    const ed=eduSentence(); const sk2=c.skills.filter(x=>!/aprend/i.test(x)).slice(0,2).map(lc);
    return `Busco minha primeira oportunidade como ${role}.${ed?' '+ed:''} Tenho facilidade para aprender`+(sk2.length?` e me destaco por ${joinE(sk2)}.`:'.')+(c.avail.includes('Início imediato')?' Disponível para início imediato.':''); }
  const m=expYears(); const acts=[]; c.exp.forEach(x=>String(x.acts||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>{ if(acts.length<2&&!acts.includes(s)) acts.push(lc(s)); }));
  const cs=c.courses.slice(0,2).map(x=>x.name);
  return `Profissional com ${yearsTxt(m)} de experiência${acts.length?', com atuação em '+joinE(acts):''}.`+(cs.length?` Possuo ${cs.length>1?'os cursos':'o curso'} ${joinE(cs)}.`:'')+` Busco oportunidade como ${role}${sk.length?', contribuindo com '+joinE(sk):''}.`;
}

/* ---------- modelo de currículo (usado na prévia e no PDF) ---------- */
function model(){
  const c=cv();
  const contacts=[c.phone&&('Tel/WhatsApp: '+c.phone),c.email,c.city,c.cnh&&('CNH categoria '+c.cnh),c.link].filter(Boolean);
  const S=[];
  if(c.summary.trim()) S.push({key:'resumo',title:'Resumo profissional',para:c.summary.trim()});
  const exp={key:'exp',title:'Experiência profissional',items:c.exp.map(x=>({title:x.role,sub:[x.company,x.city].filter(Boolean).join(' · '),right:period(x),bullets:String(x.acts||'').split('\n').map(s=>s.trim()).filter(Boolean)}))};
  const edu={key:'edu',title:'Formação',items:c.edu.map(x=>({title:x.course&&!x.level.startsWith('Ensino')?x.level.replace('Curso ','')+' em '+x.course:x.level+(x.course?' – '+x.course:''),sub:[x.school,x.status].filter(Boolean).join(' · '),right:x.year||''}))};
  const cur={key:'cursos',title:'Cursos e certificações',items:c.courses.map(x=>({title:x.name,sub:[x.school,x.hours&&(x.hours+'h')].filter(Boolean).join(' · '),right:x.year||''}))};
  const firstJob=c.area==='primeiro'||c.noExp||!c.exp.length;
  if(firstJob){ if(edu.items.length) S.push(edu); if(cur.items.length) S.push(cur); if(exp.items.length) S.push(exp); }
  else { if(exp.items.length) S.push(exp); if(edu.items.length) S.push(edu); if(cur.items.length) S.push(cur); }
  const skills=c.skills.slice(), langs=c.langs.map(l=>l.name+' – '+l.level), avail=c.avail.slice();
  return {name:c.name||'Seu Nome',role:c.role,contacts,sections:S,skills,langs,avail,color:c.color,tpl:c.tpl};
}

/* ---------- PDF ---------- */
function buildPDF(){
  const m=model(), pdf=new MiniPDF(), acc=m.color, gray='#5a6470', ink='#1e2328';
  const M=44, W=pdf.W, H=pdf.H;
  if(m.tpl==='moderno') return buildModern(m,pdf);
  const mono=m.tpl==='simples', ac=mono?'#111111':acc;
  let y=M+6;
  const ensure=h=>{ if(y+h>H-M){ pdf.addPage(); y=M; } };
  // cabeçalho
  pdf.setFont(true,mono?20:24); const nameW=pdf.width(m.name,pdf.size,true);
  if(mono){ pdf.text(m.name,(W-nameW)/2,y+14,ink); y+=24; if(m.role){ pdf.setFont(false,11.5); pdf.text(m.role,(W-pdf.width(m.role,11.5))/2,y+6,gray); y+=16; } }
  else { pdf.text(m.name,M,y+18,ink); y+=28; if(m.role){ pdf.setFont(true,12.5); pdf.text(m.role,M,y+6,ac); y+=18; } }
  pdf.setFont(false,9.5);
  const cline=m.contacts.join('   |   ');
  pdf.wrap(cline,W-2*M,9.5).forEach(l=>{ if(mono) pdf.text(l,(W-pdf.width(l,9.5))/2,y+6,gray); else pdf.text(l,M,y+6,gray); y+=13; });
  y+=4; pdf.line(M,y,W-M,y,ac,mono?0.8:1.6); y+=16;
  const secTitle=t=>{ ensure(40); pdf.setFont(true,11); pdf.text(t.toUpperCase(),M,y+4,ac); y+=8; pdf.line(M,y,W-M,y,mono?'#999999':'#d5dbe1',0.5); y+=14; };
  const para=(t,size)=>{ pdf.setFont(false,size||10); pdf.wrap(t,W-2*M,size||10).forEach(l=>{ ensure(14); pdf.text(l,M,y,ink); y+=14; }); };
  const bullets=(arr,x0)=>{ pdf.setFont(false,10); arr.forEach(b=>{ const ls=pdf.wrap(b,W-M-x0-10,10); ls.forEach((l,i)=>{ ensure(13.5); if(i===0) pdf.text('•',x0,y,ac); pdf.text(l,x0+10,y,ink); y+=13.5; }); }); };
  const items=its=>its.forEach(it=>{ ensure(34); pdf.setFont(true,10.5);
    const rw=it.right?pdf.width(it.right,9.5)+12:0; const tl=pdf.wrap(it.title,W-2*M-rw,10.5,true);
    tl.forEach((l,i)=>{ pdf.setFont(true,10.5); pdf.text(l,M,y,ink); if(i===0&&it.right){ pdf.setFont(false,9.5); pdf.textRight(it.right,W-M,y,gray); } y+=14; });
    if(it.sub){ pdf.setFont(false,9.5); pdf.wrap(it.sub,W-2*M,9.5).forEach(l=>{ pdf.text(l,M,y,gray); y+=12.5; }); }
    if(it.bullets&&it.bullets.length){ y+=2; bullets(it.bullets,M+4); }
    y+=8; });
  m.sections.forEach(s=>{ secTitle(s.title); if(s.para){ para(s.para); y+=8; } else items(s.items); y+=4; });
  const inline=(t,arr)=>{ if(!arr.length) return; secTitle(t); para(arr.join('  •  ')); y+=10; };
  inline('Habilidades',m.skills); inline('Idiomas',m.langs); inline('Disponibilidade',m.avail);
  return pdf;
}
function buildModern(m,pdf){
  const acc=m.color, W=pdf.W, H=pdf.H, SB=186, M=36, X=SB+26, ink='#1e2328', gray='#5a6470';
  const side=()=>pdf.rect(0,0,SB,H,acc);
  side();
  // barra lateral
  let sy=M+8; const sw=SB-2*24;
  pdf.setFont(true,18); pdf.wrap(m.name,sw,18,true).forEach(l=>{ pdf.text(l,24,sy+12,'#ffffff'); sy+=22; });
  if(m.role){ pdf.setFont(false,10.5); pdf.wrap(m.role,sw,10.5).forEach(l=>{ pdf.text(l,24,sy+8,'#e9eef3'); sy+=14; }); }
  sy+=28;
  const sTitle=t=>{ pdf.setFont(true,10); pdf.text(t.toUpperCase(),24,sy,'#ffffff'); sy+=6; pdf.line(24,sy,SB-24,sy,'#ffffff',0.6); sy+=14; };
  const sList=(arr,size)=>{ pdf.setFont(false,size||9.2); arr.forEach(a=>{ pdf.wrap(a,sw,size||9.2).forEach(l=>{ if(sy<H-M){ pdf.text(l,24,sy,'#ffffff'); } sy+=12.5; }); sy+=3; }); sy+=10; };
  if(m.contacts.length){ sTitle('Contato'); sList(m.contacts); }
  if(m.skills.length){ sTitle('Habilidades'); sList(m.skills.map(s=>'• '+s)); }
  if(m.langs.length){ sTitle('Idiomas'); sList(m.langs); }
  if(m.avail.length){ sTitle('Disponibilidade'); sList(m.avail); }
  // conteúdo
  let y=M+4; const RW=W-X-M;
  const ensure=h=>{ if(y+h>H-M){ pdf.addPage(); side(); y=M; } };
  const secTitle=t=>{ ensure(40); pdf.setFont(true,12); pdf.text(t.toUpperCase(),X,y+6,acc); y+=12; pdf.rect(X,y,28,2.2,acc); y+=16; };
  m.sections.forEach(s=>{ secTitle(s.title);
    if(s.para){ pdf.setFont(false,10); pdf.wrap(s.para,RW,10).forEach(l=>{ ensure(14); pdf.text(l,X,y,ink); y+=14; }); y+=10; return; }
    s.items.forEach(it=>{ ensure(34); pdf.setFont(true,10.5); pdf.wrap(it.title,RW,10.5,true).forEach(l=>{ pdf.text(l,X,y,ink); y+=14; });
      const sub=[it.sub,it.right].filter(Boolean).join('   ·   ');
      if(sub){ pdf.setFont(false,9.3); pdf.wrap(sub,RW,9.3).forEach(l=>{ pdf.text(l,X,y,gray); y+=12.5; }); }
      if(it.bullets&&it.bullets.length){ y+=2; pdf.setFont(false,10); it.bullets.forEach(b=>pdf.wrap(b,RW-10,10).forEach((l,i)=>{ ensure(13.5); if(i===0) pdf.text('•',X,y,acc); pdf.text(l,X+10,y,ink); y+=13.5; })); }
      y+=9; });
    y+=6; });
  return pdf;
}
function pdfName(){ const n=(cv().name||'curriculo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-'); return 'Curriculo-'+n+'.pdf'; }

 pronto(){ const c=cv(); const w=[];
   if(!c.name.trim()) w.push('Coloque seu nome (etapa "Seus dados").'); if(!c.phone.trim()) w.push('Coloque um telefone para contato.');
   if(!c.summary.trim()) w.push('Escreva o resumo (etapa "Objetivo"), ou toque em ✨ Escrever pra mim.');
   if(!c.edu.length) w.push('Coloque pelo menos uma formação.'); if(!c.exp.length&&!c.noExp) w.push('Adicione uma experiência ou marque "Ainda não tenho experiência".');
   if(c.skills.length<3) w.push('Marque pelo menos 3 habilidades.');
   if(c.email&&!/^\S+@\S+\.\S+$/.test(c.email)) w.push('Confira o e-mail: parece incompleto.');
   return `<h2>Seu currículo 🎉</h2>
   ${w.length?`<div class="warns"><b>Para ficar completo:</b><ul style="margin:4px 0 0;padding-left:18px">${w.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'<div class="okmsg">✅ Tudo preenchido! Confira a prévia e baixe o PDF.</div>'}
   <h3 style="margin-top:16px">Modelo</h3>
   <div class="tpls">${TPLS.map(([k,n])=>`<button class="tpl${c.tpl===k?' on':''}" data-tpl="${k}"><i>${k==='moderno'?`<span style="position:absolute;left:0;top:0;bottom:0;width:32%;background:${c.color}"></span>`:k==='classico'?`<span style="position:absolute;left:8px;right:8px;top:14px;height:3px;background:${c.color}"></span>`:`<span style="position:absolute;left:25%;right:25%;top:12px;height:3px;background:#333"></span>`}</i>${n}</button>`).join('')}</div>
   <div class="mute small" style="margin-top:4px">${c.tpl==='simples'?'Simples: preto e branco, o melhor para sites de vagas e para imprimir.':c.tpl==='moderno'?'Moderno: barra lateral colorida, chama atenção.':'Clássico: tradicional e organizado, serve para tudo.'}</div>
   ${c.tpl!=='simples'?`<div class="colors">${COLORS.map(x=>`<button style="background:${x}" class="${x===c.color?'on':''}" data-color="${x}" aria-label="Cor"></button>`).join('')}</div>`:''}
   <div class="pv-wrap" id="pv-wrap"><div class="pv-scale" id="pv">${previewHTML()}</div></div>
   <div class="grid2"><button class="btn" id="dl">⬇️ Baixar PDF</button><button class="btn okb" id="share">💬 Enviar PDF</button></div>
   <div class="tip">💡 Antes de enviar: leia em voz alta para pegar erros, e use um e-mail com seu nome. Mandando pelo WhatsApp, escreva uma mensagem curta dizendo para qual vaga é.</div>`; }
};
const BIND={
 area(){ document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{ cv().area=b.dataset.area; save(); go(1); });
   const r=$('#reset'); if(r) r.onclick=()=>{ if(confirm('Apagar o currículo salvo e começar do zero?')){ st={cv:blank(),step:0}; save(); render(); } }; },
 dados(){ const map={'d-name':'name','d-phone':'phone','d-email':'email','d-city':'city','d-link':'link','d-cnh':'cnh'};
   Object.keys(map).forEach(id=>$('#'+id).addEventListener('input',e=>{ cv()[map[id]]=e.target.value; save(); }));
   $('#d-cnh').addEventListener('change',e=>{ cv().cnh=e.target.value; save(); });
   document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{ toggle(cv().avail,b.dataset.av); save(); render(true); }); },
 objetivo(){ $('#o-role').addEventListener('input',e=>{ cv().role=e.target.value; save(); });
   document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ cv().role=b.dataset.role; $('#o-role').value=b.dataset.role; save(); });
   $('#o-sum').addEventListener('input',e=>{ cv().summary=e.target.value; save(); });
   $('#o-auto').onclick=()=>{ if(cv().summary.trim()&&!confirm('Trocar o texto atual por um novo?')) return; cv().summary=autoSummary(); $('#o-sum').value=cv().summary; save(); toast('Pronto! Ajuste do seu jeito ✍️'); }; },
 exp(){ $('#x-none').onchange=e=>{ cv().noExp=e.target.checked; save(); render(true); };
   $('#x-add').onclick=()=>expSheet(null); document.querySelectorAll('[data-edit-exp]').forEach(b=>b.onclick=()=>expSheet(cv().exp.find(x=>x.id===b.dataset.editExp))); },
 edu(){ $('#e-add').onclick=()=>eduSheet(null); document.querySelectorAll('[data-edit-edu]').forEach(b=>b.onclick=()=>eduSheet(cv().edu.find(x=>x.id===b.dataset.editEdu))); },
 cursos(){ $('#c-add').onclick=()=>curSheet(null); document.querySelectorAll('[data-edit-cur]').forEach(b=>b.onclick=()=>curSheet(cv().courses.find(x=>x.id===b.dataset.editCur)));
   document.querySelectorAll('[data-sugcur]').forEach(b=>b.onclick=()=>curSheet({name:b.dataset.sugcur},true)); },
 hab(){ document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{ toggle(cv().skills,b.dataset.sk); save(); render(true); });
   const add=()=>{ const v=$('#h-new').value.trim(); if(!v) return; if(!cv().skills.includes(v)) cv().skills.push(v); save(); render(true); };
   $('#h-add').onclick=add; $('#h-new').addEventListener('keydown',e=>{ if(e.key==='Enter') add(); });
   $('#l-add').onclick=()=>{ const n=$('#l-name').value.trim(); if(!n){ toast('Escreva o idioma'); return; } cv().langs.push({id:uid(),name:n,level:$('#l-lv').value}); save(); render(true); };
   document.querySelectorAll('[data-rm-lang]').forEach(b=>b.onclick=()=>{ cv().langs=cv().langs.filter(l=>l.id!==b.dataset.rmLang); save(); render(true); }); },
 pronto(){ fitPreview();
   document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{ cv().tpl=b.dataset.tpl; save(); render(true); });
   document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{ cv().color=b.dataset.color; save(); render(true); });
   $('#dl').onclick=()=>{ if(!ready()) return; const url=URL.createObjectURL(pdfBlob()); const a=document.createElement('a'); a.href=url; a.download=pdfName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('PDF salvo em Downloads 📄'); };
   $('#share').onclick=async()=>{ if(!ready()) return; const f=new File([pdfBlob()],pdfName(),{type:'application/pdf'});
     if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:'Currículo',text:'Segue meu currículo.'}); }catch(e){} }
     else { toast('Seu celular não deixou enviar direto. Baixe o PDF e anexe no WhatsApp.'); $('#dl').click(); } }; }
};
function ready(){ if(!cv().name.trim()){ toast('Coloque seu nome primeiro'); go(1); return false; } return true; }
function toggle(arr,v){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }
function fitPreview(){ const w=$('#pv-wrap'); if(!w) return; const s=(w.clientWidth-20)/595; const pv=$('#pv'); pv.style.transform=`scale(${s})`; const a=pv.firstElementChild; w.style.height=(a.offsetHeight*s+20)+'px'; }
window.addEventListener('resize',fitPreview);

/* ---------- formulários ---------- */
function expSheet(x){
  const isNew=!x; x=x||{id:uid(),role:'',company:'',city:'',start:'',end:'',current:false,acts:''};
  const a=A();
  openSheet(`<div class="top"><h2>${isNew?'Nova experiência':'Editar experiência'}</h2><button class="btn ghost" data-close>Fechar</button></div>
    <label class="f" for="xe-r">Cargo / função</label><input type="text" id="xe-r" value="${esc(x.role)}" placeholder="Ex.: Operador de Trator" maxlength="60">
    <label class="f" for="xe-c">Empresa</label><input type="text" id="xe-c" value="${esc(x.company)}" placeholder="Ex.: Usina São José" maxlength="60">
    <label class="f" for="xe-ci">Cidade (opcional)</label><input type="text" id="xe-ci" value="${esc(x.city)}" maxlength="40">
    <div class="grid2"><div><label class="f" for="xe-s">Entrada</label><input type="month" id="xe-s" value="${x.start}"></div><div><label class="f" for="xe-e">Saída</label><input type="month" id="xe-e" value="${x.end}" ${x.current?'disabled':''}></div></div>
    <label class="check"><input type="checkbox" id="xe-cur" ${x.current?'checked':''}> Trabalho aqui atualmente</label>
    <label class="f" for="xe-a">O que você fazia? (uma atividade por linha)</label>
    <textarea id="xe-a" placeholder="Toque nas sugestões abaixo ou escreva">${esc(x.acts)}</textarea>
    <div class="chips" style="margin-top:8px">${a.acts.map(s=>`<button class="chip add" data-act="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <button class="btn full" style="margin-top:16px" id="xe-save">💾 Salvar</button>
    ${isNew?'':'<button class="btn danger full" style="margin-top:6px" id="xe-del">🗑️ Apagar</button>'}`);
  $('#xe-cur').onchange=e=>{ $('#xe-e').disabled=e.target.checked; };
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const t=$('#xe-a'); const lines=t.value.split('\n').map(s=>s.trim()).filter(Boolean); if(!lines.includes(b.dataset.act)) lines.push(b.dataset.act); t.value=lines.join('\n'); b.remove(); });
  $('#xe-save').onclick=()=>{ const r=$('#xe-r').value.trim(), c=$('#xe-c').value.trim(); if(!r||!c){ toast('Preencha o cargo e a empresa'); return; }
    let s=$('#xe-s').value, e=$('#xe-e').value; const cur=$('#xe-cur').checked; if(s&&e&&!cur&&e<s){ const t=s; s=e; e=t; }
    Object.assign(x,{role:r,company:c,city:$('#xe-ci').value.trim(),start:s,end:cur?'':e,current:cur,acts:$('#xe-a').value.trim()});
    if(isNew) cv().exp.push(x); cv().noExp=false;
    cv().exp.sort((p,q)=>(q.current-p.current)||((q.end||q.start||'').localeCompare(p.end||p.start||'')));
    save(); closeSheet(); render(true); toast('Experiência salva ✅'); };
  if(!isNew) $('#xe-del').onclick=()=>{ if(confirm('Apagar esta experiência?')){ cv().exp=cv().exp.filter(y=>y!==x); save(); closeSheet(); render(true); } };
}
function eduSheet(x){
  const isNew=!x; x=x||{id:uid(),level:'Ensino Médio',course:'',school:'',status:'Concluído',year:''};
  openSheet(`<div class="top"><h2>${isNew?'Nova formação':'Editar formação'}</h2><button class="btn ghost" data-close>Fechar</button></div>
    <label class="f" for="ed-l">Nível</label><select id="ed-l">${LEVELS.map(l=>`<option ${l===x.level?'selected':''}>${l}</option>`).join('')}</select>
    <label class="f" for="ed-c">Curso <span class="small">(técnico, faculdade… deixe vazio no ensino médio)</span></label><input type="text" id="ed-c" value="${esc(x.course)}" placeholder="Ex.: Agropecuária" maxlength="60">
    <label class="f" for="ed-s">Escola / instituição</label><input type="text" id="ed-s" value="${esc(x.school)}" placeholder="Ex.: ETEC, SENAI, E.E. Joaquim…" maxlength="60">
    <div class="grid2"><div><label class="f" for="ed-st">Situação</label><select id="ed-st">${STATUS.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label class="f" for="ed-y">Ano de conclusão</label><input type="number" id="ed-y" value="${esc(x.year)}" placeholder="2024" min="1950" max="2040" inputmode="numeric"></div></div>
    <button class="btn full" style="margin-top:16px" id="ed-save">💾 Salvar</button>
    ${isNew?'':'<button class="btn danger full" style="margin-top:6px" id="ed-del">🗑️ Apagar</button>'}`);
  $('#ed-save').onclick=()=>{ Object.assign(x,{level:$('#ed-l').value,course:$('#ed-c').value.trim(),school:$('#ed-s').value.trim(),status:$('#ed-st').value,year:String($('#ed-y').value||'').trim()});
    if(isNew) cv().edu.push(x); cv().edu.sort((a,b)=>LEVELS.indexOf(b.level)-LEVELS.indexOf(a.level)); save(); closeSheet(); render(true); toast('Formação salva ✅'); };
  if(!isNew) $('#ed-del').onclick=()=>{ cv().edu=cv().edu.filter(y=>y!==x); save(); closeSheet(); render(true); };
}
function curSheet(x,fromSug){
  const isNew=!x||!x.id; x=Object.assign({id:uid(),name:'',school:'',hours:'',year:''},x||{});
  openSheet(`<div class="top"><h2>${isNew?'Novo curso':'Editar curso'}</h2><button class="btn ghost" data-close>Fechar</button></div>
    <label class="f" for="cu-n">Nome do curso</label><input type="text" id="cu-n" value="${esc(x.name)}" placeholder="Ex.: NR-35 Trabalho em Altura" maxlength="70">
    <label class="f" for="cu-s">Onde fez (opcional)</label><input type="text" id="cu-s" value="${esc(x.school)}" placeholder="Ex.: SENAI, SENAR, Sebrae, online" maxlength="50">
    <div class="grid2"><div><label class="f" for="cu-h">Carga horária</label><input type="number" id="cu-h" value="${esc(x.hours)}" placeholder="horas" min="1" max="9999" inputmode="numeric"></div>
    <div><label class="f" for="cu-y">Ano</label><input type="number" id="cu-y" value="${esc(x.year)}" placeholder="2025" min="1950" max="2040" inputmode="numeric"></div></div>
    ${fromSug?'<div class="tip">💡 Só coloque se você fez o curso. Confira se o certificado ainda está na validade (as NRs costumam ter reciclagem).</div>':''}
    <button class="btn full" style="margin-top:16px" id="cu-save">💾 Salvar</button>
    ${isNew?'':'<button class="btn danger full" style="margin-top:6px" id="cu-del">🗑️ Apagar</button>'}`);
  $('#cu-save').onclick=()=>{ const n=$('#cu-n').value.trim(); if(!n){ toast('Escreva o nome do curso'); return; }
    Object.assign(x,{name:n,school:$('#cu-s').value.trim(),hours:String($('#cu-h').value||'').trim(),year:String($('#cu-y').value||'').trim()});
    if(isNew) cv().courses.push(x); save(); closeSheet(); render(true); toast('Curso salvo ✅'); };
  if(!isNew) $('#cu-del').onclick=()=>{ cv().courses=cv().courses.filter(y=>y!==x); save(); closeSheet(); render(true); };
}

/* ---------- navegação ---------- */
function go(i){ st.step=Math.max(0,Math.min(STEPS.length-1,i)); save(); render(); }
function render(keepScroll){
  const sc=$('#main').scrollTop;
  if(!cv().area&&st.step>0) st.step=0;
  const [k,n]=STEPS[st.step];
  $('#stepname').textContent=`Etapa ${st.step+1} de ${STEPS.length} · ${n}`;
  $('#prog').innerHTML=STEPS.map((s,i)=>`<button class="${i<st.step?'done':i===st.step?'cur':''}" data-go="${i}" aria-label="${s[1]}"></button>`).join('');
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ if(cv().area) go(+b.dataset.go); });
  $('#main').innerHTML=VIEWS[k]();
  BIND[k]();
  $('#prev').disabled=st.step===0;
  $('#next').textContent=st.step===STEPS.length-1?'✅ Pronto':st.step===STEPS.length-2?'Ver currículo ›':'Próximo ›';
  $('#next').hidden=k==='area'&&!cv().area;
  $('#main').scrollTop=keepScroll?sc:0;
}
$('#prev').onclick=()=>go(st.step-1);
$('#next').onclick=()=>{
  const k=STEPS[st.step][0];
  if(k==='dados'&&!cv().name.trim()){ toast('Coloque pelo menos seu nome'); $('#d-name').focus(); return; }
  if(k==='pronto'){ toast('Seu currículo fica salvo aqui. Volte quando quiser atualizar 💾'); return; }
  go(st.step+1);
};

/* ---------- instalação ---------- */
let deferred=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(!standalone()) $('#install-btn').hidden=false;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; });
window.addEventListener('appinstalled',()=>{ $('#install-btn').hidden=true; toast('App instalado! 🎉'); });
$('#install-btn').onclick=async()=>{
  if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; return; }
  openSheet(`<div class="top"><h2>Instalar no celular</h2><button class="btn ghost" data-close>Fechar</button></div>
    <p>1. No Chrome, toque no menu <b>⋮</b> (três pontinhos, lá em cima).</p><p>2. Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>
    <p>No iPhone (Safari): <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>.</p><button class="btn full" data-close>Entendi</button>`);
};
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.__cv={buildPDF,model,st:()=>st};
render();
})();
</script>
