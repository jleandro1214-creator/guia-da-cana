<style>
:root{--verde:#1b3a24;--verde2:#2e6b3a;--folha:#7ec078;--amarelo:#f2c230;--marrom:#6b4423;--marrom2:#a8794a;--bg:#f6f1e4;--card:#fffdf7;--fg:#1f2a20;--mut:#5e6a5f;--line:#e2d9c4;--soft:#e7efe3;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--verde);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:5px solid var(--marrom)}
header .row{display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:12px}
header h1{margin:0;font-size:22px;line-height:1.15}
header p{margin:2px 0 0;font-size:15px;opacity:.85}
#b-inst{margin-left:auto;background:var(--amarelo);color:var(--verde);border:0;border-radius:10px;font:800 15px system-ui;padding:9px 10px}
main{max-width:700px;margin:0 auto;padding:14px 14px 30px}
section.tab{animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
h2{font-size:20px;margin:18px 0 10px;color:var(--verde)}
h3{font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--marrom);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--mut)}
.small{font-size:15px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--verde);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;border-top:4px solid var(--amarelo)}
nav button{flex:1;background:none;border:0;color:#dfe9dc;font:700 13px system-ui;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:23px;line-height:1}
nav button[aria-selected=true]{background:#ffffff1f;color:var(--amarelo)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:14px;padding:12px 8px;text-align:center;color:#fff}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat small{font-size:14px;font-weight:700}
.s-util{background:var(--verde2)}.s-raz{background:#c79a12}.s-nao{background:var(--marrom)}
.bar{height:12px;border-radius:99px;background:#e6dcc5;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--folha))}
/* matrix */
.mtx{display:grid;grid-template-columns:22px 1fr 1fr;grid-template-rows:1fr 1fr 22px;gap:6px}
.mtx .ylab{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:13px;font-weight:700;color:var(--mut)}
.mtx .xlab{grid-column:2/4;text-align:center;font-size:13px;font-weight:700;color:var(--mut)}
.q{border-radius:14px;padding:10px;min-height:120px}
.q h4{margin:0 0 6px;font-size:15px}
.q p{margin:0 0 8px;font-size:13px;opacity:.85}
.q1{background:#e3f1df}.q2{background:#fff3cc}.q3{background:#eef0ea}.q4{background:#f1e4d6}
.mini{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 9px;margin:0 4px 5px 0;font-size:14px;font-weight:600;color:var(--fg)}
.mini.pal{border-style:dashed;opacity:.8}
/* list */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:99px;font:700 15px system-ui}
.chip[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
#busca{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);margin-bottom:8px}
.app{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:9px;width:100%;text-align:left;font:inherit;color:inherit}
.app img{width:54px;height:54px;border-radius:13px;flex:none;background:#ddd}
.app .t{flex:1;min-width:0}
.app b{display:block;font-size:18px}
.app small{display:block;color:var(--mut);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:13px;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}
.t-util{background:var(--verde2)}.t-raz{background:#c79a12}.t-nao{background:var(--marrom)}.t-pal{background:#8a948b}.t-ok{background:#e7efe3;color:var(--verde)}
.notas{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-weight:700;color:var(--mut);flex:none}
.notas em{font-style:normal;font-size:17px;color:var(--fg)}
/* sheet */
#ficha{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
#ficha .top{position:sticky;top:0;background:var(--verde);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;z-index:2;border-bottom:4px solid var(--marrom)}
#ficha .top button{background:#ffffff26;color:#fff;border:0;border-radius:10px;font:800 17px system-ui;padding:9px 13px}
#ficha .top b{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ficha .wrap{max-width:700px;margin:0 auto;padding:14px}
.head{display:flex;gap:14px;align-items:center}
.head img{width:72px;height:72px;border-radius:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;font:800 16px system-ui;padding:12px 14px;text-decoration:none;cursor:pointer}
.b1{background:var(--verde);color:#fff}.b2{background:var(--amarelo);color:var(--verde)}.b3{background:var(--soft);color:var(--verde)}.b4{background:#f1e4d6;color:var(--marrom)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1 1 140px}
.palpite{background:#fff8de;border:1.5px dashed var(--amarelo);border-radius:14px;padding:12px}
.palpite b{color:var(--marrom)}
.pq{padding:10px 0;border-bottom:1px solid var(--line)}
.pq:last-child{border-bottom:0}
.pq p{margin:0 0 7px;font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--fg);border-radius:10px;padding:10px 4px;font:700 15px system-ui}
.seg button.on[data-v="2"]{background:var(--verde2);border-color:var(--verde2);color:#fff}
.seg button.on[data-v="1"]{background:var(--amarelo);border-color:var(--amarelo);color:var(--verde)}
.seg button.on[data-v="0"]{background:var(--marrom);border-color:var(--marrom);color:#fff}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res div{border-radius:14px;padding:12px;text-align:center;background:var(--soft)}
.res b{display:block;font-size:28px;color:var(--verde)}
.res small{font-weight:700;color:var(--mut)}
.decisao{margin-top:10px;border-radius:14px;padding:12px 14px;background:var(--verde);color:#fff;font-weight:700}
.decisao span{display:block;font-size:14px;font-weight:500;opacity:.9;margin-top:3px}
.pt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.pt:last-child{border-bottom:0}
.pt input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:var(--verde2)}
.pt .tx{flex:1}
.pt.feito .tx{text-decoration:line-through;color:var(--mut)}
.pt .tp{display:inline-block;font-size:12px;font-weight:800;padding:1px 7px;border-radius:99px;margin-right:4px;vertical-align:1px}
.tp-Utilidade{background:#e3f1df;color:var(--verde2)}.tp-Usabilidade{background:#fff3cc;color:#7a5d00}.tp-Técnico{background:#f1e4d6;color:var(--marrom)}
.pt .del{background:none;border:0;font-size:20px;color:var(--mut);padding:0 4px}
.add{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.add input{flex:1 1 200px;font-size:17px;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.add select{font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea{width:100%;min-height:96px;font:17px/1.4 system-ui;padding:11px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--fg)}
.dec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dec-chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px;font:700 14px system-ui;color:var(--fg)}
.dec-chips button[aria-pressed=true]{background:var(--marrom);border-color:var(--marrom);color:#fff}
.fila .fh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.fila .fh img{width:36px;height:36px;border-radius:10px}
.fila .fh b{flex:1;font-size:17px}
.fila .fh button{border:0;background:var(--soft);color:var(--verde);border-radius:10px;padding:7px 10px;font:800 14px system-ui}
.grupo{border-left:5px solid var(--amarelo)}
.grupo p{margin:4px 0 8px}
.vazio{text-align:center;color:var(--mut);padding:26px 8px}
ol.how{padding-left:22px;margin:6px 0}ol.how li{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
</style>
</head>

function notas(d){const a=A(d.id),r=a.r;let u=0,s=0,nu=0,ns=0;for(let i=0;i<5;i++){if(r["u"+i]!=null){u+=r["u"+i];nu++}if(r["s"+i]!=null){s+=r["s"+i];ns++}}
 const av=nu===5&&ns===5;return{u:av?u:d.u,s:av?s:d.s,av,parcial:(nu+ns>0)&&!av,resp:nu+ns}}
function classU(u){return u>=7?["Útil","util"]:u>=4?["Razoável","raz"]:["Não útil","nao"]}

 if(e.target.id==="b-rel"){relatorio();return}
 if(e.target.id==="b-bkp"){backup();return}
 if(e.target.id==="b-rest"){$("#arq").click();return}
});
document.addEventListener("change",e=>{const c=e.target.closest("[data-pid]");if(!c)return;const p=A(c.dataset.pid).pts[+c.dataset.pi];p.f=c.checked;p.em=c.checked?new Date().toISOString():null;save();
 if(!$("#ficha").hidden){const y=$("#ficha").scrollTop;ficha(aberto);$("#ficha").scrollTop=y}else{toast(c.checked?"✔ Melhoria feita!":"Voltou para pendente");setTimeout(render,350)}});
document.addEventListener("input",e=>{if(e.target.id==="nota"){A(aberto).nota=e.target.value;save()}if(e.target.id==="busca"){q=e.target.value;lista()}});
document.addEventListener("keydown",e=>{if(e.target.id==="novo"&&e.key==="Enter")addPt()});
function addPt(){const i=$("#novo"),t=i.value.trim();if(!t){i.focus();return}A(aberto).pts.push({t,tp:$("#novo-tp").value,f:false,meu:true});save();const y=$("#ficha").scrollTop;ficha(aberto);$("#ficha").scrollTop=y;toast("Ponto adicionado")}

async function compartilhar(txt,titulo){
 if(navigator.share){try{await navigator.share({title:titulo,text:txt});return}catch(e){if(e.name==="AbortError")return}}
 try{await navigator.clipboard.writeText(txt);toast("Copiado! É só colar.")}catch(e){window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank")}
}
function pedir(){const d=APPS.find(x=>x.id===aberto),a=A(aberto),n=notas(d);const ps=a.pts.filter(p=>!p.f);
 const txt=`Laboratório dos Apps — vamos melhorar o app "${d.n}" (${BASE+d.p}).\nAvaliação: utilidade ${n.u}/10 (${classU(n.u)[0]}), usabilidade ${n.s}/10 (${classS(n.s)})${n.av?"":" — palpite"}.\nDecisão: ${DEC[decOf(d)][0]}.\nPontos a melhorar:\n${ps.map((p,i)=>`${i+1}. [${p.tp}] ${p.t}`).join("\n")||"(nenhum pendente)"}${a.nota?`\nMinhas anotações: ${a.nota}`:""}\nFaça essas melhorias e publique de novo no mesmo endereço.`;
 compartilhar(txt,"Pedir melhoria")}
function relatorio(){const ls=[...APPS].sort((a,b)=>notas(b).u-notas(a).u);
 const g={};ls.forEach(d=>{const k=DEC[decOf(d)][0];(g[k]=g[k]||[]).push(d)});
 let txt=`🧪 Laboratório dos Apps — relatório\nAvaliados: ${APPS.filter(d=>notas(d).av).length} de ${APPS.length}\n`;
 for(const k of Object.values(DEC).map(x=>x[0])){if(!g[k])continue;txt+=`\n${k}\n`+g[k].map(d=>{const n=notas(d);return`• ${d.n} — U ${n.u} · S ${n.s}${n.av?"":" (palpite)"} · ${pend(d)} pendente(s)`}).join("\n")+"\n"}
 compartilhar(txt,"Relatório do laboratório")}
function backup(){const blob=new Blob([JSON.stringify({app:"laboratorio",v:1,data:new Date().toISOString(),st},null,1)],{type:"application/json"});
 const nome="laboratorio-apps-"+new Date().toISOString().slice(0,10)+".json";const file=new File([blob],nome,{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:nome}).catch(()=>{});return}
 const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=nome;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Backup salvo em Downloads")}
$("#arq").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=="laboratorio"||!j.st)throw 0;if(!confirm("Trocar os dados atuais pelos do backup?"))return;st=j.st;st.apps=st.apps||{};APPS.forEach(a=>A(a.id));save();render();toast("Backup restaurado ✔")}catch(err){toast("Arquivo de backup inválido")}e.target.value=""};

/* ---------- ABAS + ARRASTO ---------- */
const TABS=["painel","apps","melh","como"];let atual="painel";
function tab(t){atual=t;TABS.forEach(x=>{$("#t-"+x).hidden=x!==t});document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));render();scrollTo(0,0)}
function render(){if(atual==="painel")painel();if(atual==="apps")lista();if(atual==="melh")melh();if(atual==="como")como()}
let sx=0,sy=0,ok=false;
$("#main").addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=!e.target.closest(".chips,input,textarea")},{passive:true});
$("#main").addEventListener("touchend",e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)*1.3){const i=TABS.indexOf(atual)+(dx<0?1:-1);if(i>=0&&i<TABS.length)tab(TABS[i])}},{passive:true});

/* ---------- INSTALAR ---------- */
let def=null;const sa=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(!sa())$("#b-inst").hidden=false;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();def=e});
$("#b-inst").onclick=async()=>{if(def){def.prompt();try{await def.userChoice}catch(e){}def=null}else alert('No Chrome, toque no menu ⋮ e depois em "Instalar app" (ou "Adicionar à tela inicial").')};
addEventListener("appinstalled",()=>$("#b-inst").hidden=true);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
